<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ad4U - Professional Ad & Earning Dashboard</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #f3f4f6; }
    header { background: #1f2937; color: #fff; padding: 1rem; }
    .btn { @apply bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700 transition; }
    .iframe-container { position: relative; width: 100%; padding-bottom: 56.25%; margin-bottom: 1rem; }
    .iframe-container iframe { position: absolute; width: 100%; height: 100%; border: none; }
    .dashboard-card { @apply bg-white shadow p-4 rounded mb-4; }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="flex justify-between items-center">
    <h1 class="text-xl font-bold">Ad4U Dashboard</h1>
    <div>
      <button id="login-btn" class="btn">Login with Gmail</button>
      <button id="logout-btn" class="btn hidden">Logout</button>
    </div>
  </header>

  <!-- DASHBOARD STATS -->
  <section class="p-4 grid grid-cols-1 md:grid-cols-4 gap-4">
    <div class="dashboard-card">
      <h2 class="font-bold">Total Coins</h2>
      <p id="coins-total">0</p>
    </div>
    <div class="dashboard-card">
      <h2 class="font-bold">Web Coins</h2>
      <p id="w-coins">0</p>
    </div>
    <div class="dashboard-card">
      <h2 class="font-bold">Direct Link Coins</h2>
      <p id="d-coins">0</p>
    </div>
    <div class="dashboard-card">
      <h2 class="font-bold">YouTube Watch Time (s)</h2>
      <p id="yt-watch">0</p>
    </div>
  </section>

  <!-- REFERRAL -->
  <section class="p-4">
    <h2 class="text-lg font-bold mb-2">Referral Link</h2>
    <input type="text" id="ref-link" class="border p-2 w-full mb-2" readonly>
    <button id="copy-ref-link" class="btn">Copy Referral Link</button>
  </section>

  <!-- WEB TRAFFIC -->
  <section class="p-4">
    <h2 class="text-lg font-bold mb-2">Web Traffic Ads</h2>
    <div class="iframe-container">
      <iframe id="web-iframe" src="http://cludymovie.com/"></iframe>
    </div>
  </section>

  <!-- DIRECT LINKS -->
  <section class="p-4">
    <h2 class="text-lg font-bold mb-2">Direct Links</h2>
    <div id="direct-links-container">
      <a href="https://otieu.com/4/9677163" target="_blank" class="btn block mb-2">Open Link & Earn 1000 Coins</a>
    </div>
  </section>

  <!-- YOUTUBE WATCH -->
  <section class="p-4">
    <h2 class="text-lg font-bold mb-2">YouTube Watch</h2>
    <div class="iframe-container">
      <iframe id="yt-iframe" src="https://www.youtube.com/embed/Uw9bqrrV-yI?enablejsapi=1" allow="autoplay"></iframe>
    </div>
  </section>

  <!-- PREMIUM PLAN -->
  <section class="p-4">
    <h2 class="text-lg font-bold mb-2">Premium Plans</h2>
    <div class="flex gap-2">
      <button id="buy-weekly" class="btn">Weekly $3</button>
      <button id="buy-monthly" class="btn">Monthly $10</button>
    </div>
  </section>

  <!-- FIREBASE & LOGIC SCRIPTS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.6.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.6.1/firebase-firestore.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.6.1/firebase-auth.js";

    // FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyAnu49G3ZZaMhRAYwoBPKfcRoj7sfcu5E8",
      authDomain: "ad-4-u.firebaseapp.com",
      projectId: "ad-4-u",
      storageBucket: "ad-4-u.firebasestorage.app",
      messagingSenderId: "775864010731",
      appId: "1:775864010731:web:ea8a2ff4f772ca80ac3bae",
      measurementId: "G-3R9DDSM2XK"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // LOGIN/LOGOUT
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');

    loginBtn.addEventListener('click', async () => {
      const result = await signInWithPopup(auth, provider);
      const user = result.user;
      const userRef = doc(db, "users", user.uid);
      const userSnap = await getDoc(userRef);
      if (!userSnap.exists()) {
        await setDoc(userRef, {
          email: user.email,
          displayName: user.displayName,
          username: user.displayName.toUpperCase(),
          role: "free",
          plan: "none",
          premium_expiry: null,
          coins: { usable: 0, pending: 0 },
          W_coins: 0,
          D_coins: 0,
          yt_views: 0,
          yt_watch_seconds: 0,
          referrer: null,
          createdAt: serverTimestamp()
        });
      }
    });

    logoutBtn.addEventListener('click', () => signOut(auth));

    // DASHBOARD LIVE STATS
    onAuthStateChanged(auth, user => {
      if (user) {
        loginBtn.classList.add('hidden');
        logoutBtn.classList.remove('hidden');
        const userRef = doc(db, "users", user.uid);

        // Live update coins & stats
        onSnapshot(userRef, snap => {
          const data = snap.data();
          document.getElementById('coins-total').innerText = data.coins.usable + data.coins.pending;
          document.getElementById('w-coins').innerText = data.W_coins;
          document.getElementById('d-coins').innerText = data.D_coins;
          document.getElementById('yt-watch').innerText = data.yt_watch_seconds + "s";
          if(document.getElementById('ref-link')){
            document.getElementById('ref-link').value = window.location.origin + "?ref=" + user.uid;
          }
        });

        // WEB TRAFFIC AUTOMATION
        setInterval(async () => {
          await updateDoc(userRef, {
            W_coins: serverTimestamp(), // For demo, replace with real calculation
            "coins.usable": serverTimestamp()
          });
        },15000); // Every 15 sec

        // PREMIUM PURCHASE
        document.getElementById('buy-weekly').addEventListener('click', async () => {
          await updateDoc(userRef, {
            role: "premium",
            plan: "weekly",
            premium_expiry: new Date(new Date().getTime() + 7*24*60*60*1000)
          });
          alert("Weekly Premium Activated!");
        });

        document.getElementById('buy-monthly').addEventListener('click', async () => {
          await updateDoc(userRef, {
            role: "premium",
            plan: "monthly",
            premium_expiry: new Date(new Date().getTime() + 30*24*60*60*1000)
          });
          alert("Monthly Premium Activated!");
        });
      } else {
        loginBtn.classList.remove('hidden');
        logoutBtn.classList.add('hidden');
      }
    });

    // REFERRAL COPY
    document.getElementById('copy-ref-link').addEventListener('click', () => {
      const refInput = document.getElementById('ref-link');
      refInput.select();
      document.execCommand("copy");
      alert("Referral link copied!");
    });

  </script>
</body>
</html>
