<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Ad Revenue Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/a72199b9c9.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        /* Custom scrollbar for better look */
        .ad-container::-webkit-scrollbar { width: 8px; }
        .ad-container::-webkit-scrollbar-thumb { background-color: #6366f1; border-radius: 4px; }
        .ad-container::-webkit-scrollbar-track { background-color: #e5e7eb; }
    </style>
</head>
<body>

<div id="app" class="min-h-screen flex flex-col">

    <!-- Header / Secure Balance Display -->
    <header class="bg-indigo-700 shadow-lg p-4 sticky top-0 z-10">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-white tracking-wider">AdCore Pro</h1>
            <div class="flex items-center space-x-6">
                <div class="text-right">
                    <p id="user-balance" class="text-3xl font-extrabold text-green-300">$0.00</p>
                    <p class="text-xs text-gray-200 uppercase tracking-widest mt-[-4px]">Current Balance</p>
                </div>
                <div class="text-right">
                    <p id="user-status" class="text-lg font-semibold text-yellow-300">Loading...</p>
                    <p class="text-xs text-gray-200 uppercase tracking-widest mt-[-4px]">Account Status</p>
                </div>
                <button id="profile-btn" onclick="app.navigate('profile')" class="text-white hover:text-indigo-200 transition duration-150 p-2 rounded-full hover:bg-indigo-600">
                    <i class="fas fa-user-circle text-2xl"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow flex max-w-6xl mx-auto w-full p-4">
        <!-- Sidebar Navigation -->
        <nav class="w-64 bg-white p-4 rounded-xl shadow-xl h-fit sticky top-20">
            <h2 class="text-lg font-semibold text-gray-700 mb-4">Menu</h2>
            <ul class="space-y-2">
                <li><button onclick="app.navigate('dashboard')" class="nav-btn w-full text-left p-3 rounded-lg flex items-center space-x-3 text-indigo-600 bg-indigo-50 hover:bg-indigo-100 transition duration-150"><i class="fas fa-chart-line w-5"></i><span>Dashboard</span></button></li>
                <li><button onclick="app.navigate('web_traffic')" class="nav-btn w-full text-left p-3 rounded-lg flex items-center space-x-3 text-gray-700 hover:bg-gray-100 transition duration-150"><i class="fas fa-globe w-5"></i><span>Web Traffic (Ads)</span></button></li>
                <li><button onclick="app.navigate('premium')" class="nav-btn w-full text-left p-3 rounded-lg flex items-center space-x-3 text-gray-700 hover:bg-gray-100 transition duration-150"><i class="fas fa-crown w-5"></i><span>Get Premium</span></button></li>
                <li><button onclick="app.navigate('profile')" class="nav-btn w-full text-left p-3 rounded-lg flex items-center space-x-3 text-gray-700 hover:bg-gray-100 transition duration-150"><i class="fas fa-id-card w-5"></i><span>Profile</span></button></li>
            </ul>
            <div class="mt-6 pt-4 border-t border-gray-200">
                <p id="user-id-display" class="text-xs text-gray-500 break-all"></p>
            </div>
        </nav>

        <!-- Dynamic Content Area -->
        <section id="content-area" class="flex-grow ml-6 bg-white p-8 rounded-xl shadow-xl">
            <!-- Content will be injected here -->
            <div class="text-center py-20">
                <i class="fas fa-spinner fa-spin text-indigo-500 text-4xl"></i>
                <p class="mt-4 text-gray-500">Loading application...</p>
            </div>
        </section>
    </main>
</div>

<!-- Custom Modal Placeholder for alerts/confirmations -->
<div id="custom-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-sm">
        <h3 id="modal-title" class="text-xl font-bold mb-3 text-gray-800">Alert</h3>
        <p id="modal-message" class="text-gray-600 mb-6"></p>
        <div class="flex justify-end space-x-3">
            <button id="modal-cancel" class="hidden px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition">Cancel</button>
            <button id="modal-confirm" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">OK</button>
        </div>
    </div>
</div>

<script type="module">
    // Firebase Imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, updateDoc, collection, getDocs, runTransaction, setDoc, query, where, limit, arrayUnion, serverTimestamp, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- Global Canvas Variables ---
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
    const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

    // --- Firebase Initialization ---
    let app, db, auth;
    let userId = null;
    let isAuthReady = false;

    // Set Firestore log level for debugging
    setLogLevel('Debug');

    // --- App State ---
    const appState = {
        currentPage: 'dashboard',
        user: {
            balance: 0.00,
            status: 'Loading...',
            isPremium: false,
            expiryDate: null,
            uid: null,
        },
        ads: [], // Stores available ads fetched from Firebase
        watching: {
            isActive: false,
            timerSeconds: 0,
            intervalId: null,
            adsShown: [],
        },
    };

    // --- Utility Functions ---

    /** Shows a custom modal (replaces alert/confirm) */
    function showModal(title, message, isConfirm = false, onConfirm = () => {}) {
        const modal = document.getElementById('custom-modal');
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-message').textContent = message;
        
        const confirmBtn = document.getElementById('modal-confirm');
        const cancelBtn = document.getElementById('modal-cancel');

        modal.classList.remove('hidden');

        confirmBtn.onclick = () => {
            modal.classList.add('hidden');
            onConfirm();
        };

        if (isConfirm) {
            cancelBtn.classList.remove('hidden');
            cancelBtn.onclick = () => modal.classList.add('hidden');
        } else {
            cancelBtn.classList.add('hidden');
        }
    }

    /** Helper to format currency */
    const formatCurrency = (amount) => {
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);
    };

    /** Shuffles an array (Fisher-Yates) */
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }


    // --- Core UI Rendering & State Management ---

    function updateUI() {
        // 1. Update Header
        document.getElementById('user-balance').textContent = formatCurrency(appState.user.balance);
        const statusEl = document.getElementById('user-status');
        statusEl.textContent = appState.user.status;
        statusEl.className = appState.user.isPremium ? 'text-lg font-semibold text-pink-400' : 'text-lg font-semibold text-yellow-300';
        document.getElementById('user-id-display').textContent = `User ID: ${appState.user.uid || 'N/A'}`;

        // 2. Navigation Styling
        document.querySelectorAll('.nav-btn').forEach(btn => {
            const page = btn.getAttribute('onclick').match(/'([^']+)'/)[1];
            if (page === appState.currentPage) {
                btn.classList.add('text-indigo-600', 'bg-indigo-50');
                btn.classList.remove('text-gray-700', 'hover:bg-gray-100');
            } else {
                btn.classList.remove('text-indigo-600', 'bg-indigo-50');
                btn.classList.add('text-gray-700', 'hover:bg-gray-100');
            }
        });
        
        // 3. Render Current Page
        renderPage(appState.currentPage);
    }

    // --- FIREBASE LISTENERS & DATA FLOW ---

    function setupDataListeners() {
        if (!db || !userId) {
            console.error("Firebase not initialized or userId not available.");
            return;
        }

        // 1. User Profile Listener (Private Data)
        const userDocRef = doc(db, `artifacts/${appId}/users/${userId}/profile`, 'user_data');
        onSnapshot(userDocRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                appState.user.balance = data.balance || 0.00;
                appState.user.isPremium = data.isPremium || false;
                appState.user.expiryDate = data.expiryDate ? data.expiryDate.toDate() : null;
                appState.user.status = appState.user.isPremium 
                    ? `Premium (Expires: ${appState.user.expiryDate ? appState.user.expiryDate.toLocaleDateString() : 'N/A'})` 
                    : 'Free User';
                
                // Check for expired subscription
                if (appState.user.isPremium && appState.user.expiryDate && new Date() > appState.user.expiryDate) {
                    console.log("Premium subscription expired. Downgrading...");
                    // Note: This check should ideally be done by an Admin/Backend service, 
                    // but we include client-side logic for demonstration.
                    updateDoc(userDocRef, { isPremium: false, status: 'Free User', expiryDate: null });
                }

                console.log("User data updated:", appState.user);
                updateUI();
            } else {
                // Initialize user profile if it doesn't exist
                setDoc(userDocRef, { 
                    uid: userId, 
                    balance: 0.00, 
                    isPremium: false, 
                    status: 'Free User',
                    createdAt: serverTimestamp()
                }, { merge: true });
            }
        }, (error) => console.error("Error listening to user profile:", error));


        // 2. Available Ads Listener (Public Data)
        const adsCollectionRef = collection(db, `artifacts/${appId}/public/data/available_ads`);
        onSnapshot(adsCollectionRef, (querySnapshot) => {
            appState.ads = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            console.log(`Fetched ${appState.ads.length} available ads.`);
            if (appState.currentPage === 'web_traffic' && !appState.watching.isActive) {
                 renderPage('web_traffic'); // Re-render if on the ad page
            }
        }, (error) => console.error("Error listening to available ads:", error));
    }


    // --- SECURE MATH & COUNTING (TRANSACTIONS) ---

    /**
     * Securely increments the user balance using a Firestore Transaction.
     * This prevents concurrent writes from overwriting each other (race conditions),
     * ensuring that every watch/view is counted exactly once.
     * @param {number} amount - The amount to add to the balance (e.g., 0.001 per view).
     */
    async function secureIncrementBalance(amount) {
        if (!db || !userId) return console.error("Database or User ID not ready for transaction.");

        const userDocRef = doc(db, `artifacts/${appId}/users/${userId}/profile`, 'user_data');

        try {
            await runTransaction(db, async (transaction) => {
                const userDoc = await transaction.get(userDocRef);
                
                if (!userDoc.exists()) {
                    throw "User Document does not exist!";
                }

                // Retrieve current balance, default to 0 if not set
                const currentBalance = userDoc.data().balance || 0;
                const newBalance = currentBalance + amount;

                // Update the balance securely within the transaction
                transaction.update(userDocRef, { balance: newBalance });
                console.log(`Transaction successful. Added ${amount} to balance. New balance: ${newBalance.toFixed(4)}`);
                
                // Update local state immediately for a smooth UI experience
                appState.user.balance = newBalance;
                updateUI();

            });
        } catch (e) {
            console.error("Secure transaction failed: ", e);
            showModal("Error", "Failed to count view securely. Please try again.");
        }
    }

    // --- Ad Watching System ---

    /**
     * Initializes the multi-iFrame ad watching session.
     * @param {number} numAds - Number of iFrames to generate (max 15).
     */
    function startWatching(numAds) {
        if (appState.watching.isActive) return;

        // Reset state
        appState.watching.timerSeconds = 0;
        appState.watching.isActive = true;
        appState.watching.adsShown = [];

        // Determine max duration: 60 seconds for Free, unlimited for Premium (simulated here)
        const maxDuration = appState.user.isPremium ? 300 : 60; // 5 mins for premium demo, 60s for free

        // 1. Select the ads to show (ensure different ads are shown)
        let selectedAds = shuffleArray([...appState.ads]).slice(0, numAds);
        if (selectedAds.length === 0) {
            appState.watching.isActive = false;
            showModal("Ad Error", "No ads available to watch. Please try again later.");
            renderPage('web_traffic');
            return;
        }

        // 2. Render the iFrames and start the simulation
        const contentArea = document.getElementById('content-area');
        let html = `
            <div class="mb-6 p-4 bg-indigo-50 rounded-xl">
                <h2 class="text-2xl font-bold text-indigo-700">Ad Watching Session Active</h2>
                <p id="timer-display" class="text-xl font-mono mt-2 text-indigo-900">Time Left: ${maxDuration}s</p>
                <button onclick="app.stopWatching()" class="mt-3 px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition shadow">Stop Watching</button>
            </div>
            <div id="iframe-grid" class="grid gap-4" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));">
        `;

        const watchValuePerAd = 0.001; // $0.001 per ad view
        const adWatchDuration = 5; // Simulate a 5-second watch before counting

        selectedAds.forEach((ad, index) => {
            appState.watching.adsShown.push(ad.id);
            // iFrame FIX: We use the ad.url from the Firestore document. If the external site prevents embedding (X-Frame-Options), 
            // the iFrame will show an error. This is a browser security feature, not a code bug. 
            // We use sandbox attributes for security but allow forms/scripts from the same origin if necessary.
            html += `
                <div class="ad-card bg-gray-100 p-3 rounded-lg shadow-md border border-gray-200">
                    <p class="text-sm font-semibold mb-2 text-gray-700">Ad Slot ${index + 1} (${ad.id})</p>
                    <div class="w-full aspect-video bg-gray-300 rounded-lg overflow-hidden relative">
                        <!-- Simulation of Ad Content - Replace the placeholder URL with real ad tracking URLs -->
                        <iframe id="ad-iframe-${index}" 
                                src="${ad.url || 'https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1'}" 
                                frameborder="0" 
                                allow="autoplay; encrypted-media; fullscreen" 
                                sandbox="allow-scripts allow-same-origin"
                                class="w-full h-full"></iframe>
                        <div id="watch-overlay-${index}" class="absolute inset-0 bg-indigo-500 bg-opacity-75 flex items-center justify-center text-white font-bold text-lg opacity-0 transition duration-500">Watching...</div>
                    </div>
                </div>
            `;
        });

        html += '</div>';
        contentArea.innerHTML = html;

        // 3. Start the main session timer
        appState.watching.intervalId = setInterval(() => {
            appState.watching.timerSeconds++;
            const timeLeft = maxDuration - appState.watching.timerSeconds;
            
            document.getElementById('timer-display').textContent = `Time Left: ${timeLeft}s`;

            // Check if the 60-second limit is reached for Free users
            if (!appState.user.isPremium && timeLeft <= 0) {
                stopWatching();
                app.navigate('premium');
                showModal("Time Limit Reached", "Your 60-second ad watching session has ended. Go Premium to unlock unlimited ad time!", false, () => {});
                return;
            }

            // Check if the overall session limit is reached (for Premium demo)
            if (timeLeft <= 0) {
                 stopWatching();
                 showModal("Session Ended", "Your current ad session has concluded.", false, () => {});
                 return;
            }

            // 4. Counting/Earning Logic (Simulate view count after adWatchDuration)
            if (appState.watching.timerSeconds % adWatchDuration === 0) {
                const totalEarned = selectedAds.length * watchValuePerAd;
                secureIncrementBalance(totalEarned);
                
                // Show visual feedback
                selectedAds.forEach((_, index) => {
                     const overlay = document.getElementById(`watch-overlay-${index}`);
                     if(overlay) {
                         overlay.textContent = `+${(watchValuePerAd).toFixed(3)}$!`;
                         overlay.style.opacity = '1';
                         setTimeout(() => overlay.style.opacity = '0', 2000);
                     }
                });

                console.log(`Counted ${selectedAds.length} views. Earned: ${totalEarned.toFixed(4)}`);
            }

        }, 1000);

        console.log(`Started watching ${numAds} ads for max ${maxDuration} seconds.`);
    }
    
    /** Stops the ad watching session and resets the state. */
    function stopWatching() {
        if (appState.watching.intervalId) {
            clearInterval(appState.watching.intervalId);
            appState.watching.intervalId = null;
        }
        appState.watching.isActive = false;
        appState.watching.timerSeconds = 0;
        appState.watching.adsShown = [];
        renderPage('web_traffic');
        console.log("Ad watching session stopped.");
    }

    // --- Premium Payment System ---

    /** Handles the submission of the payment request to Firestore. */
    async function submitPaymentRequest(e) {
        e.preventDefault();
        
        const form = e.target;
        const trxId = form.elements['trxId'].value.trim();
        const plan = form.elements['plan'].value;
        const screenshotFile = form.elements['screenshot'].files[0];
        const paymentMethod = form.elements['paymentMethod'].value;

        if (!trxId || !plan || !screenshotFile || !paymentMethod) {
            return showModal("Missing Info", "Please provide the Transaction ID, select a plan, and upload the payment screenshot.");
        }

        // 1. Simulate File Upload (In a real app, this goes to Firebase Storage, then the URL is saved to Firestore)
        // For this single-file environment, we will *simulate* the upload and mention the file name/type.
        const mockScreenshotPath = `gs://storage-bucket/premium_proofs/${userId}/${Date.now()}_${screenshotFile.name}`;

        const requestData = {
            userId: userId,
            plan: plan,
            amount: plan === '$5/week' ? 5 : 30,
            paymentMethod: paymentMethod,
            trxId: trxId,
            screenshotPath: mockScreenshotPath, // The path for Admin to find the file
            status: 'Pending Review', // Crucial: Admin needs to change this
            requestedAt: serverTimestamp(),
        };
        
        const requestsCollectionRef = collection(db, `artifacts/${appId}/public/data/premium_requests`);

        try {
            // Save the request to the public collection for Admin visibility
            await addDoc(requestsCollectionRef, requestData);
            form.reset();
            showModal("Request Submitted", 
                "Your premium request is now **Pending Review**. Please allow the admin time to verify the TRX ID and screenshot. You will be automatically upgraded once approved.",
                false, 
                () => app.navigate('dashboard'));
        } catch (error) {
            console.error("Error submitting payment request:", error);
            showModal("Submission Failed", "There was an error submitting your request. Check the console for details.");
        }
    }


    // --- View Rendering Logic ---

    function renderPage(page) {
        appState.currentPage = page;
        const contentArea = document.getElementById('content-area');
        let html = '';

        if (appState.watching.isActive && page === 'web_traffic') {
             // Do nothing, the watching view is already rendered and manages its own state
             return; 
        }

        switch (page) {
            case 'dashboard':
                html = `
                    <h2 class="text-3xl font-extrabold text-gray-800 mb-6 border-b pb-2">Dashboard Overview</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-indigo-500 text-white p-6 rounded-xl shadow-lg">
                            <i class="fas fa-wallet text-3xl mb-3"></i>
                            <p class="text-sm uppercase font-semibold opacity-80">Total Earnings</p>
                            <p class="text-4xl font-extrabold mt-1">${formatCurrency(appState.user.balance)}</p>
                        </div>
                        <div class="bg-yellow-500 text-white p-6 rounded-xl shadow-lg">
                            <i class="fas fa-eye text-3xl mb-3"></i>
                            <p class="text-sm uppercase font-semibold opacity-80">Views Today (Simulated)</p>
                            <p class="text-4xl font-extrabold mt-1">~${(appState.user.balance * 1000).toFixed(0)}</p>
                        </div>
                        <div class="bg-pink-500 text-white p-6 rounded-xl shadow-lg">
                            <i class="fas fa-medal text-3xl mb-3"></i>
                            <p class="text-sm uppercase font-semibold opacity-80">Account Tier</p>
                            <p class="text-3xl font-extrabold mt-1">${appState.user.isPremium ? 'PREMIUM' : 'FREE'}</p>
                        </div>
                    </div>

                    <div class="mt-8 bg-gray-50 p-6 rounded-xl border border-gray-200">
                        <h3 class="text-xl font-bold text-gray-700 mb-4">Quick Actions</h3>
                        <div class="flex flex-wrap gap-4">
                            <button onclick="app.navigate('web_traffic')" class="bg-green-500 text-white px-6 py-3 rounded-full hover:bg-green-600 transition shadow-md">Start Watching Ads</button>
                            ${!appState.user.isPremium ? `<button onclick="app.navigate('premium')" class="bg-pink-500 text-white px-6 py-3 rounded-full hover:bg-pink-600 transition shadow-md">Upgrade to Premium</button>` : ''}
                        </div>
                    </div>
                `;
                break;
            
            case 'web_traffic':
                html = `
                    <h2 class="text-3xl font-extrabold text-gray-800 mb-6 border-b pb-2">Web Traffic (Ad Watcher)</h2>
                    <div class="p-6 bg-yellow-50 rounded-xl border border-yellow-200 mb-6">
                        <p class="text-yellow-800 font-medium"><i class="fas fa-info-circle mr-2"></i> **iFrame Fix Note:** Embedding external websites often fails due to browser security settings (X-Frame-Options, CORS). The system below uses ad URLs from Firebase, but **only URLs you control** will reliably display.</p>
                        ${appState.user.isPremium 
                            ? `<p class="mt-2 text-pink-700 font-bold"><i class="fas fa-crown mr-2"></i> **PREMIUM:** You have unlimited watching time and can watch up to 15 ads simultaneously!</p>`
                            : `<p class="mt-2 text-red-600 font-bold"><i class="fas fa-lock mr-2"></i> **FREE LIMIT:** You can only watch for 60 seconds. Upgrade to Premium for unlimited time!</p>`
                        }
                    </div>

                    <div class="bg-gray-100 p-6 rounded-xl shadow-inner">
                        <h3 class="text-xl font-bold text-gray-700 mb-4">Watch More at a Time</h3>
                        <p class="mb-4 text-gray-600">How many ads do you want to run simultaneously? (Max: ${appState.user.isPremium ? 15 : 5})</p>
                        <form id="ad-watch-form">
                            <div class="flex items-end space-x-4">
                                <div class="flex-grow">
                                    <label for="numAds" class="block text-sm font-medium text-gray-700">Number of Ads to Watch</label>
                                    <input type="number" id="numAds" name="numAds" value="1" min="1" max="${appState.user.isPremium ? 15 : 5}" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-3">
                                </div>
                                <button type="submit" class="px-6 py-3 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700 transition shadow-lg flex-shrink-0">
                                    <i class="fas fa-play mr-2"></i> Start Watching
                                </button>
                            </div>
                        </form>
                    </div>

                    <div id="ad-info-container" class="mt-6 text-center">
                        ${appState.ads.length > 0 ? `<p class="text-sm text-gray-500">Currently ${appState.ads.length} unique ads are available.</p>` : `<p class="text-sm text-red-500">No ads available. Please launch ads in the admin panel.</p>`}
                    </div>
                `;
                break;

            case 'premium':
                html = `
                    <h2 class="text-3xl font-extrabold text-gray-800 mb-6 border-b pb-2">Get Premium Account</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                        <div class="bg-gray-50 p-6 rounded-xl shadow-lg border border-gray-200">
                            <h3 class="text-2xl font-bold text-gray-700 mb-4">Premium Benefits</h3>
                            <ul class="space-y-3 text-gray-600">
                                <li class="flex items-center"><i class="fas fa-infinity text-green-500 w-5 mr-3"></i> Unlimited Ad Watching Time</li>

                            <div class="mt-4">

                `;
                break;
            
            case 'profile':
                html = `
                    <h2 class="text-3xl font-extrabold text-gray-800 mb-6 border-b pb-2">User Profile</h2>

                        <div class="p-4 bg-white rounded-lg border">

                        ${appState.user.isPremium ? `

                            <button onclick="app.navigate('premium')" class="w-full px-4 py-3 bg-pink-500 text-white rounded-lg hover:bg-pink-600 transition font-semibold mt-4">

                            </button>
                        `}
                        <div class="mt-6 border-t pt-4">

                `;
                break;

            default:
                html = '<p class="text-gray-500">Page not found.</p>';
        }

        contentArea.innerHTML = html;
        
        // Attach event listeners for forms after rendering
        if (page === 'web_traffic' && !appState.watching.isActive) {
            document.getElementById('ad-watch-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const numAds = parseInt(document.getElementById('numAds').value, 10);
                const maxAllowed = appState.user.isPremium ? 15 : 5;

                if (numAds > maxAllowed) {
                     showModal("Limit Exceeded", `You can only watch up to ${maxAllowed} ads simultaneously in your current tier.`, false, () => {});
                     document.getElementById('numAds').value = maxAllowed;
                     return;
                }
                if (appState.ads.length < numAds) {
                     showModal("Ad Shortage", `You requested ${numAds} ads, but only ${appState.ads.length} are currently available.`, false, () => {});
                     return;
                }
                startWatching(numAds);
            });
        } else if (page === 'premium') {
            document.getElementById('payment-submission-form').addEventListener('submit', submitPaymentRequest);
        }
    }


    // --- Initialization and Public API ---

    /** Initialize Firebase and setup Auth Listener */
    async function init() {
        if (!Object.keys(firebaseConfig).length) {
             console.error("Firebase config is missing. Cannot initialize app.");
             return;
        }

        app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);

        try {
            if (initialAuthToken) {
                await signInWithCustomToken(auth, initialAuthToken);
            } else {
                await signInAnonymously(auth);
            }
        } catch (error) {
            console.error("Firebase Auth failed:", error);
            showModal("Authentication Error", "Failed to sign in. Please refresh.", false, () => {});
        }

        // Auth state listener to get the current user ID
        onAuthStateChanged(auth, (user) => {
            if (user && !isAuthReady) {
                userId = user.uid;
                appState.user.uid = userId;
                isAuthReady = true;
                setupDataListeners();
                updateUI();
            } else if (!user) {
                 // Fallback for unauthenticated users, though we expect a token
                 userId = crypto.randomUUID();
                 appState.user.uid = userId;
                 isAuthReady = true;
                 setupDataListeners();
                 updateUI();
            }
        });
    }

    // Public API for HTML access
    window.app = {
        navigate: (page) => {
            appState.currentPage = page;
            updateUI();
        },
        startWatching,
        stopWatching,
    };

    // Start the application
    init();
</script>
