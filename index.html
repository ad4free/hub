<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Ad Exchange - Free & Paid Traffic</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#4f46e5',
                        'secondary': '#10b981',
                        'dark-bg': '#0f172a',
                        'card-bg': '#1e293b',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        
        body { background-color: #0f172a; color: #f3f4f6; font-family: 'Inter', sans-serif; }
        body::-webkit-scrollbar { width: 8px; }
        body::-webkit-scrollbar-track { background: #0f172a; }
        body::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 4px; }
        
        .ad-iframe {
            width: 100%;
            height: 400px;
            border-radius: 0.5rem;
            border: 4px solid #334155;
            background-color: #0f172a;
        }
        
        .nav-link {
            transition: all 0.2s;
            cursor: pointer;
        }
        .nav-link:hover {
            transform: translateX(4px);
            background-color: #374151;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Main Header -->
    <header id="header" class="bg-card-bg shadow-lg sticky top-0 z-10">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center flex-wrap">
            <h1 class="text-2xl font-bold text-primary">Global Traffic Exchange</h1>
            <div id="balance-display" class="flex flex-wrap gap-4 text-sm mt-2 md:mt-0">
                <span class="font-semibold text-secondary">
                    Total W Coins: <span id="w-coins-display" class="font-bold text-lg">0</span>
                </span>
                <span class="font-semibold text-yellow-400">
                    YT Time: <span id="yt-time-display" class="font-bold text-lg">0h 0m 0s</span>
                </span>
                <span class="font-semibold text-red-400">
                    YT Views: <span id="yt-views-display" class="font-bold text-lg">0</span>
                </span>
            </div>
        </div>
    </header>

    <div class="flex flex-grow">
        <!-- Sidebar Navigation -->
        <nav id="sidebar" class="w-64 bg-gray-800 p-4 space-y-2 hidden md:block flex-shrink-0">
            <h3 class="text-lg font-bold text-gray-300 mb-4 border-b border-gray-700 pb-2">Navigation</h3>
            <button onclick="navigateTo('dashboard')" id="nav-dashboard" class="nav-link w-full text-left p-3 rounded-lg bg-gray-700 text-white font-medium flex items-center gap-2">
                <!-- SVG Icon --> Dashboard
            </button>
            <button onclick="navigateTo('traffic')" id="nav-traffic" class="nav-link w-full text-left p-3 rounded-lg bg-gray-700 text-white font-medium flex items-center gap-2">
                <!-- SVG Icon --> Website Traffic (W Coins)
            </button>
            <button onclick="navigateTo('direct_link')" id="nav-direct_link" class="nav-link w-full text-left p-3 rounded-lg bg-gray-700 text-white font-medium flex items-center gap-2">
                <!-- SVG Icon --> Direct Link (D Coins)
            </button>
            <button onclick="navigateTo('yt_watch_time')" id="nav-yt_watch_time" class="nav-link w-full text-left p-3 rounded-lg bg-gray-700 text-white font-medium flex items-center gap-2">
                <!-- SVG Icon --> YouTube Watch Time
            </button>
            <button onclick="navigateTo('yt_views')" id="nav-yt_views" class="nav-link w-full text-left p-3 rounded-lg bg-gray-700 text-white font-medium flex items-center gap-2">
                <!-- SVG Icon --> YouTube Views
            </button>
            <button onclick="navigateTo('referral')" id="nav-referral" class="nav-link w-full text-left p-3 rounded-lg bg-gray-700 text-white font-medium flex items-center gap-2">
                <!-- SVG Icon --> Referral System
            </button>
            <button onclick="navigateTo('launch_ad')" id="nav-launch_ad" class="nav-link w-full text-left p-3 rounded-lg bg-primary text-white font-medium flex items-center gap-2 shadow-lg hover:shadow-xl transform hover:scale-[1.01] transition duration-150">
                <!-- SVG Icon --> Launch Ad
            </button>
        </nav>

        <!-- Main Content Area -->
        <main id="main-content" class="flex-grow p-4 md:p-8 overflow-y-auto w-full">
            <!-- Loader/Error for initial Firebase setup -->
            <div id="loader" class="text-center py-20 text-xl text-primary">Loading application and user data...</div>
            <div id="content-container" class="hidden">
                <!-- Dynamic content will be rendered here -->
            </div>
        </main>
    </div>

    <!-- Custom Modal for Alerts/Confirms -->
    <div id="custom-modal" class="fixed inset-0 bg-black bg-opacity-75 hidden z-50 items-center justify-center">
        <div class="bg-card-bg p-6 rounded-xl shadow-2xl w-full max-w-sm text-center">
            <h4 id="modal-title" class="text-xl font-bold mb-3 text-primary"></h4>
            <p id="modal-message" class="mb-6 text-gray-300"></p>
            <button id="modal-close-btn" class="bg-primary hover:bg-indigo-600 text-white font-bold py-2 px-6 rounded-lg transition duration-150">OK</button>
        </div>
    </div>

    <!-- Firebase SDK Imports (Non-Module) -->
    <!-- Switched to v8 CDN links for better compatibility in restrictive environments like Blogger -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <!-- Main Application Logic (Non-Module Script Block) -->
    <script>
        // Use a function wrapper to scope variables, then immediately call it.
        (function() {
            
            // --- GLOBAL STATE & CONFIGURATION ---
            
            // Mandatory Global Variables provided by the Canvas Environment
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-traffic-app';
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
                // Fallback configuration if global variable is not set (MUST BE VALID for the hosting environment)
                apiKey: "AIzaSyCUnWnmNHHJPFKzkyJ59-cK8kag6OpIoIM",
                authDomain: "website-5636d.firebaseapp.com",
                projectId: "website-5636d",
                storageBucket: "website-5636d.firebasestorage.app",
                messagingSenderId: "737574321288",
                appId: "1:737574321288:web:e92da5e5w4d63b87d8b33d"
            };
            const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

            let app;
            let db;
            let auth;
            let userId = null;
            let isAuthReady = false;
            
            let currentPage = window.location.hash.substring(1) || 'dashboard'; 
            const validPages = ['dashboard', 'traffic', 'direct_link', 'yt_watch_time', 'yt_views', 'referral', 'launch_ad'];

            let userBalance = {
                usableBalance: 0,
                webTrafficEarnings: 0,
                directLinkEarnings: 0,
                ytHours: 0,
                ytMinutes: 0,
                ytSeconds: 0,
                views: 0,
                referralCode: null,
                totalReferralCommission: 0
            };

            let currentAd = null;
            let adTimer = null;
            const WEB_TRAFFIC_COIN_REWARD = 500;
            const DIRECT_LINK_REWARD = 1000;
            const REFERRAL_BONUS = 5000;
            const REFERRAL_COMMISSION_RATE = 0.15; // 15%

            const SAMPLE_WEB_ADS = [
                { id: 'sample1', url: 'https://www.google.com/search?q=free+traffic', title: 'Sample Ad 1: Search Engine Traffic', remainingImpressions: 99999 },
                { id: 'sample2', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1', title: 'Sample Ad 2: Placeholder YouTube', remainingImpressions: 99999 }
            ];

            const SAMPLE_YT_VIDEOS = [
                'https://www.youtube.com/embed/k-p_159b3W8?autoplay=1&mute=1&enablejsapi=1',
                'https://www.youtube.com/embed/jNQXAC9IVRw?autoplay=1&mute=1&enablejsapi=1',
                'https://www.youtube.com/embed/C2F6v_8407I?autoplay=1&mute=1&enablejsapi=1'
            ];
            let currentYTIndex = 0;
            let ytPlayer = null;
            let ytTimeInterval = null;
            let currentVideoSessionPlayTime = 0; // Tracks play time for the current YT video

            // --- UTILITY FUNCTIONS ---
            
            window.customAlert = (title, message) => {
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-message').innerText = message;
                document.getElementById('custom-modal').classList.remove('hidden');
                document.getElementById('custom-modal').classList.add('flex');
                document.getElementById('modal-close-btn').onclick = () => {
                    document.getElementById('custom-modal').classList.add('hidden');
                    document.getElementById('custom-modal').classList.remove('flex');
                };
            };

            const formatTime = (totalSeconds) => {
                const hours = Math.floor(totalSeconds / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const seconds = totalSeconds % 60;
                return `${hours}h ${minutes}m ${seconds}s`;
            };

            // --- FIREBASE V8 REFERENCE HELPERS ---
            // Note: These now use the V8 syntax (db.collection().doc())
            
            const getUserProfileDocRef = (uid) => db.collection(`artifacts/${appId}/users/${uid}/profile`).doc('data');
            const getWebAdsCollectionRef = () => db.collection(`artifacts/${appId}/public/data/web_ads`);
            const getReferralEarningsCollectionRef = (uid) => db.collection(`artifacts/${appId}/users/${uid}/referral_earnings`);
            
            const setupBalanceListener = () => {
                if (!userId || typeof db === 'undefined') {
                    console.error("Firestore not initialized or userId missing for listener setup.");
                    return;
                }

                // V8 onSnapshot syntax
                getUserProfileDocRef(userId).onSnapshot((docSnapshot) => {
                    if (docSnapshot.exists) {
                        const data = docSnapshot.data();
                        
                        userBalance.usableBalance = data.usableBalance || 0;
                        userBalance.webTrafficEarnings = data.webTrafficEarnings || 0;
                        userBalance.directLinkEarnings = data.directLinkEarnings || 0;
                        userBalance.ytHours = data.ytHours || 0;
                        userBalance.ytMinutes = data.ytMinutes || 0;
                        userBalance.ytSeconds = data.ytSeconds || 0;
                        userBalance.views = data.views || 0;
                        userBalance.referralCode = data.referralCode || userId;
                        
                        updateHeaderDisplay();
                    } else {
                        console.log('User profile not found. Creating a new one.');
                        const initialData = {
                            usableBalance: 0,
                            webTrafficEarnings: 0,
                            directLinkEarnings: 0,
                            ytHours: 0,
                            ytMinutes: 0,
                            ytSeconds: 0,
                            views: 0,
                            referralCode: userId,
                            createdAt: new Date().toISOString()
                        };
                        // V8 set syntax
                        getUserProfileDocRef(userId).set(initialData, { merge: true }).catch(err => console.error("Error creating profile:", err));
                    }
                }, (error) => {
                    console.error("Error listening to user balance:", error);
                });
            };

            /**
             * Initializes Firebase and authenticates the user.
             */
            const initFirebase = async () => {
                try {
                    // Check for the global V8 firebase object
                    if (typeof firebase === 'undefined' || typeof firebase.initializeApp === 'undefined') {
                        throw new Error("Firebase SDK functions (v8) are not globally available. Check CDN script loading.");
                    }
                    
                    // V8 Initialization
                    app = firebase.initializeApp(firebaseConfig);
                    auth = firebase.auth(); 
                    db = firebase.firestore();

                    // V8: Set Firestore Log Level (if available)
                    if (typeof firebase.firestore.setLogLevel !== 'undefined') {
                        firebase.firestore.setLogLevel('Debug');
                    }

                    // V8: Wait for auth state to change
                    auth.onAuthStateChanged(async (user) => {
                        if (user) {
                            // SUCCESSFULLY AUTHENTICATED
                            userId = user.uid;
                            
                            // Referral logic (must run after successful auth)
                            const urlParams = new URLSearchParams(window.location.search);
                            const referrerCode = urlParams.get('ref');
                            
                            const userDocRef = getUserProfileDocRef(userId);
                            // V8 get syntax
                            const userDoc = await userDocRef.get();

                            if (referrerCode && referrerCode !== userId && (!userDoc.exists || (userDoc.exists && !userDoc.data().referredBy))) {
                                // V8 set syntax
                                await userDocRef.set({ referredBy: referrerCode, referralDate: new Date().toISOString() }, { merge: true });
                                console.log(`User ${userId} referred by ${referrerCode}.`);
                            }
                            
                            isAuthReady = true;
                            setupBalanceListener();
                            
                            // HIDE LOADER AND SHOW CONTENT
                            document.getElementById('loader').classList.add('hidden');
                            document.getElementById('content-container').classList.remove('hidden');
                            
                            // Render the page now that auth is ready
                            renderPage();
                        } else {
                            // FAILED/ANONYMOUS FALLBACK
                            if (!userId) {
                                // Fallback for environments where auth fails but we need a user ID for Firestore
                                userId = crypto.randomUUID(); 
                                console.warn("Signed out/Anonymous auth failed. Using temporary ID.");
                                document.getElementById('loader').classList.add('hidden');
                                document.getElementById('content-container').classList.remove('hidden');
                                isAuthReady = true; // Allow basic rendering even without full Firebase connection
                                renderPage();
                            }
                        }
                    });

                    // Perform the initial sign-in. V8 syntax.
                    if (initialAuthToken) {
                        await auth.signInWithCustomToken(initialAuthToken);
                    } else {
                        await auth.signInAnonymously();
                    }

                } catch (error) {
                    console.error("Firebase Auth failed on startup:", error);
                    // Display the critical error message immediately
                    const loader = document.getElementById('loader');
                    loader.classList.remove('text-primary');
                    loader.classList.add('text-red-500', 'p-6', 'rounded-lg', 'bg-red-900/20', 'border', 'border-red-500');
                    loader.innerHTML = `
                        <p class="text-2xl font-bold mb-4">CRITICAL: Authentication Failed!</p>
                        <p class="mt-4 text-lg">Error: ${error.message}</p>
                        <p class="text-sm mt-2 font-mono text-gray-400 break-all">Current Origin: ${window.location.origin}</p>
                    `;
                }
            };

            // --- UI & RENDERING ---

            const updateHeaderDisplay = () => {
                document.getElementById('w-coins-display').innerText = userBalance.usableBalance.toLocaleString();
                const totalYtSeconds = userBalance.ytHours * 3600 + userBalance.ytMinutes * 60 + userBalance.ytSeconds;
                document.getElementById('yt-time-display').innerText = formatTime(totalYtSeconds);
                document.getElementById('yt-views-display').innerText = userBalance.views.toLocaleString();
                
                let header = document.getElementById('header');
                let userIdSpan = document.getElementById('user-id-display');
                
                if (!userIdSpan) {
                    userIdSpan = document.createElement('span');
                    userIdSpan.id = 'user-id-display';
                    userIdSpan.className = 'text-xs text-gray-400 w-full md:w-auto mt-1 md:mt-0';
                    header.querySelector('div').appendChild(userIdSpan);
                }
                userIdSpan.innerHTML = `User ID: <span class='font-mono text-primary break-all'>${userId || 'Authenticating...'}</span>`;
            };
            
            const navigateTo = (page, skipHashUpdate = false) => {
                if (adTimer) clearInterval(adTimer);
                
                if (ytTimeInterval) {
                    clearInterval(ytTimeInterval);
                    ytTimeInterval = null;
                }
                if (ytPlayer && typeof ytPlayer.stopVideo === 'function') {
                    try {
                        ytPlayer.stopVideo();
                    } catch(e) {
                        console.warn("Could not stop YT player on navigation.", e);
                    }
                }
                
                if (currentPage.startsWith('yt_')) {
                    currentVideoSessionPlayTime = 0;
                }

                if (!validPages.includes(page)) {
                    page = 'dashboard';
                }

                currentPage = page;

                if (!skipHashUpdate) {
                    window.location.hash = page;
                }
                
                if (isAuthReady) {
                     renderPage();
                }
            };
            window.navigateTo = navigateTo; 

            const renderPage = () => {
                if (!isAuthReady) return;

                const container = document.getElementById('content-container');
                container.innerHTML = '';
                let contentHTML = '';

                document.querySelectorAll('.nav-link').forEach(btn => {
                    const pageId = btn.id.replace('nav-', '');
                    btn.classList.remove('bg-primary', 'bg-gray-700');
                    if (pageId === currentPage) {
                        btn.classList.add('bg-primary');
                    } else {
                        btn.classList.add('bg-gray-700');
                    }
                });

                switch (currentPage) {
                    case 'dashboard':
                        contentHTML = renderDashboard();
                        break;
                    case 'traffic':
                        contentHTML = renderTrafficPage();
                        break;
                    case 'direct_link':
                        contentHTML = renderDirectLinkPage();
                        break;
                    case 'yt_watch_time':
                        contentHTML = renderYoutubeWatchTimePage();
                        break;
                    case 'yt_views':
                        contentHTML = renderYoutubeViewsPage();
                        break;
                    case 'referral':
                        contentHTML = renderReferralPage();
                        break;
                    case 'launch_ad':
                        contentHTML = renderLaunchAdPage();
                        break;
                }
                container.innerHTML = contentHTML;

                if (currentPage === 'traffic') {
                    loadWebAd();
                }
                if (currentPage === 'yt_watch_time' || currentPage === 'yt_views') {
                    loadYoutubeAPI();
                }
                if (currentPage === 'referral') {
                    loadReferralCommissions();
                }
                if (currentPage === 'launch_ad') {
                    loadMyAds();
                }
            };

            // --- PAGE RENDERING FUNCTIONS ---
            
            const renderDashboard = () => {
                const totalEarnings = userBalance.webTrafficEarnings + userBalance.directLinkEarnings;
                return `
                    <div class="space-y-8">
                        <h2 class="text-3xl font-extrabold text-primary border-b border-gray-700 pb-3">Dashboard Overview</h2>
                        
                        <!-- Balance Summary -->
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                            <div class="bg-card-bg p-6 rounded-xl shadow-xl border-t-4 border-secondary">
                                <p class="text-sm text-gray-400">Usable Balance (W Coins)</p>
                                <p class="text-4xl font-bold text-white">${userBalance.usableBalance.toLocaleString()}</p>
                                <p class="text-xs text-secondary mt-1">Total coins for launching ads.</p>
                            </div>
                            <div class="bg-card-bg p-6 rounded-xl shadow-xl border-t-4 border-yellow-400">
                                <p class="text-sm text-gray-400">Traffic Earnings (W)</p>
                                <p class="text-4xl font-bold text-white">${userBalance.webTrafficEarnings.toLocaleString()}</p>
                                <p class="text-xs text-yellow-400 mt-1">Earned from Website Traffic.</p>
                            </div>
                            <div class="bg-card-bg p-6 rounded-xl shadow-xl border-t-4 border-blue-400">
                                <p class="text-sm text-gray-400">Direct Link Earnings (D)</p>
                                <p class="text-4xl font-bold text-white">${userBalance.directLinkEarnings.toLocaleString()}</p>
                                <p class="text-xs text-blue-400 mt-1">Earned from Direct Links.</p>
                            </div>
                            <div class="bg-card-bg p-6 rounded-xl shadow-xl border-t-4 border-red-400">
                                <p class="text-sm text-gray-400">Total YT Views Earned</p>
                                <p class="text-4xl font-bold text-white">${userBalance.views.toLocaleString()}</p>
                                <p class="text-xs text-red-400 mt-1">Earned for your YouTube campaigns.</p>
                            </div>
                        </div>

                        <!-- Plan & Instruction Details -->
                        <div class="bg-card-bg p-6 rounded-xl shadow-xl">
                            <h3 class="text-2xl font-bold text-primary mb-4">Our Service Program Details</h3>
                            
                            <div class="p-4 rounded-lg bg-indigo-900/30 border border-primary/50 mb-4">
                                <p class="text-lg font-extrabold text-white mb-2">
                                    <span class="bg-secondary px-2 py-1 rounded-md text-dark-bg mr-2">!</span>
                                    <span class="font-black text-yellow-300">WANT SPECIAL COUNTRY TRAFFIC?</span>
                                </p>
                                <p class="text-gray-300">
                                    You need to <span class="font-bold text-xl text-red-400">Use PC</span> and <span class="font-bold text-xl text-red-400">Follow this link Instruction</span> (coming soon) after following this you can get any country traffic in your Link. This feature is part of our **Paid Service Program**.
                                </p>
                            </div>
                            
                            <div class="space-y-4 text-gray-300">
                                <p>This platform offers two types of programs: a **Free Service** where you earn coins by performing actions (watching ads, clicking links) and a **Paid Service** where you can buy coins or advanced geo-targeting features for your campaigns.</p>
                                <p><span class="font-bold text-lg text-secondary">Website Traffic (W Coins):</span> Earn 500 W Coins for every 15 seconds you view another user's ad. These W Coins are your primary usable currency.</p>
                                <p><span class="font-bold text-lg text-blue-400">Direct Links (D Coins):</span> Earn 1000 D Coins for opening and verifying a direct link. D Coins are instantly converted to Usable W Coins.</p>
                                <p><span class="font-bold text-lg text-yellow-400">YouTube Watch Time/Views:</span> Earn actual H:M:S and Views which are dedicated currencies for running your own YouTube campaigns. No money conversion—it's pure time/view exchange!</p>
                            </div>
                        </div>
                    </div>
                `;
            };
            
            const renderTrafficPage = () => {
                return `
                    <div class="space-y-6">
                        <h2 class="text-3xl font-extrabold text-primary border-b border-gray-700 pb-3">Website Traffic Exchange (Earn W Coins)</h2>
                        <div class="bg-card-bg p-6 rounded-xl shadow-xl space-y-4">
                            <div class="flex justify-between items-center p-3 bg-gray-800 rounded-lg">
                                <p class="text-lg text-gray-300">Time Remaining to Earn:</p>
                                <p id="traffic-timer" class="text-4xl font-bold text-secondary">15</p>
                            </div>
                            
                            <iframe id="ad-iframe" class="ad-iframe" frameborder="0" allowfullscreen></iframe>
                            
                            <div class="text-center pt-2">
                                <p class="text-sm text-gray-400">You earn ${WEB_TRAFFIC_COIN_REWARD.toLocaleString()} W Coins for every 15 seconds of viewing.</p>
                                <p class="text-sm text-yellow-400 font-bold">Please keep this page focused and visible to ensure accurate coin crediting.</p>
                            </div>
                        </div>
                    </div>
                `;
            };
            
            const loadWebAd = async () => {
                const container = document.getElementById('ad-iframe');
                const timerDisplay = document.getElementById('traffic-timer');
                let ads = SAMPLE_WEB_ADS;

                try {
                    // V8 Query Syntax
                    const qRef = getWebAdsCollectionRef().where("remainingImpressions", ">", 0);
                    const snapshot = await qRef.get(); // .get() for V8
                    if (!snapshot.empty) {
                        ads = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    }
                } catch (error) {
                    console.warn("Could not fetch live ads from Firestore. Using samples.", error);
                }

                ads.sort(() => Math.random() - 0.5);

                let adIndex = 0;
                let countdown = 15;

                const updateTimerAndIframe = async () => {
                    if (adIndex >= ads.length) {
                        adIndex = 0;
                        ads.sort(() => Math.random() - 0.5);
                    }
                    
                    currentAd = ads[adIndex];
                    container.src = currentAd.url;
                    countdown = 15;
                    timerDisplay.innerText = countdown;
                };

                const intervalTick = async () => {
                    countdown--;
                    timerDisplay.innerText = countdown;

                    if (countdown <= 0) {
                        await rewardUser('webTrafficEarnings', WEB_TRAFFIC_COIN_REWARD);

                        if (currentAd && currentAd.id.length > 10) {
                            await trackImpression(currentAd.id);
                        }
                        
                        adIndex++;
                        await updateTimerAndIframe();
                    }
                };

                const trackImpression = async (adId) => {
                    // V8 DocRef + Update Syntax
                    const adRef = getWebAdsCollectionRef().doc(adId);
                    try {
                        await adRef.update({
                            remainingImpressions: currentAd.remainingImpressions - 1
                        });
                    } catch (error) {
                        console.error("Failed to track impression for ad:", adId, error);
                    }
                };

                await updateTimerAndIframe();
                adTimer = setInterval(intervalTick, 1000);
            };
            
            const renderDirectLinkPage = () => {
                return `
                    <div class="space-y-6">

                }
            };
            
            const updateYTBalance = async (type) => {
                 if (!userId) return;

                 const userRef = getUserProfileDocRef(userId);
                 let updateData = {};
                 
                 if (type === 'watchTime') {
                     updateData = {
                         ytHours: userBalance.ytHours,
                         ytMinutes: userBalance.ytMinutes,
                         ytSeconds: userBalance.ytSeconds,
                     };
                 } else if (type === 'views') {
                     updateData = {
                         views: userBalance.views
                     };
                 }

                 try {
                    // V8 update syntax
                    await userRef.update(updateData);
                 } catch (error) {
                     console.error("Error updating YT balance:", error);
                 }
            };

            // --- INITIALIZATION ---
            
            window.addEventListener('hashchange', () => {
                const hash = window.location.hash.substring(1);
                navigateTo(hash, true);
            });

            window.onload = () => {
                 // 1. Initialize Firebase
                 initFirebase();
                 
                 // 2. Set the initial page from the hash
                 if (!validPages.includes(currentPage)) {
                     currentPage = 'dashboard';
                     window.location.hash = currentPage;
                 }
            };

        })(); // End of IIFE for script scoping
    </script>

        window.onYouTubeIframeAPIReady = window.onYouTubeIframeAPIReady || function() { console.log("YouTube API Ready Global Placeholder"); };
