<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ad4U - User Dashboard</title>
  <script type="module">
    // Firebase SDK
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore.js";

    // Your Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyAnu49G3ZZaMhRAYwoBPKfcRoj7sfcu5E8",
      authDomain: "ad-4-u.firebaseapp.com",
      projectId: "ad-4-u",
      storageBucket: "ad-4-u.firebasestorage.app",
      messagingSenderId: "775864010731",
      appId: "1:775864010731:web:ea8a2ff4f772ca80ac3bae",
      measurementId: "G-3R9DDSM2XK"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Global user object
    let currentUser = null;
    let userDocRef = null;

    // -------------------------------
    // AUTHENTICATION
    // -------------------------------
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');

    loginBtn.addEventListener('click', async () => {
      const provider = new GoogleAuthProvider();
      try {
        const result = await signInWithPopup(auth, provider);
        currentUser = result.user;
        await initUser();
      } catch (err) {
        alert(err.message);
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await signOut(auth);
      location.reload();
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        await initUser();
      } else {
        document.getElementById('auth-section').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
      }
    });

    // -------------------------------
    // INITIALIZE USER DOCUMENT
    // -------------------------------
    async function initUser() {
      document.getElementById('auth-section').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      userDocRef = doc(db, 'users', currentUser.uid);
      const docSnap = await getDoc(userDocRef);

      if (!docSnap.exists()) {
        // New user
        await setDoc(userDocRef, {
          email: currentUser.email,
          displayName: currentUser.displayName,
          username: currentUser.displayName,
          role: "free",
          plan: "none",
          premium_expiry: null,
          coins: { usable: 0, pending: 0 },
          W_coins: 0,
          D_coins: 0,
          yt_views: 0,
          yt_watch_seconds: 0,
          referrer: null,
          createdAt: serverTimestamp()
        });
      }

      // Listen live updates
      onSnapshot(userDocRef, (docSnap) => {
        const data = docSnap.data();
        document.getElementById('displayName').innerText = data.displayName;
        document.getElementById('coins').innerText = data.coins.usable;
        document.getElementById('W_coins').innerText = data.W_coins;
        document.getElementById('D_coins').innerText = data.D_coins;
        document.getElementById('yt_views').innerText = data.yt_views;
        document.getElementById('yt_watch_seconds').innerText = data.yt_watch_seconds;
        document.getElementById('premiumStatus').innerText = (data.role === "premium") ? "Premium ✅" : "Free ❌";
      });
    }

    // -------------------------------
    // EARN COINS FUNCTION (WEB TRAFFIC EXAMPLE)
    // -------------------------------
    let currentIframe = 0;
    const webAds = ["http://cludymovie.com/", "http://newswithsk.com/"];
    const iframeEl = document.getElementById('web-iframe');
    const timerEl = document.getElementById('web-timer');

    function startWebAds() {
      iframeEl.src = webAds[currentIframe];
      let seconds = 15;
      timerEl.innerText = seconds;

      const interval = setInterval(async () => {
        seconds--;
        timerEl.innerText = seconds;
        if (seconds <= 0) {
          clearInterval(interval);
          // Add 500 W_coins
          await updateDoc(userDocRef, {
            W_coins: incrementField('W_coins', 500),
            'coins.usable': incrementField('coins.usable', 500)
          });
          // Next iframe
          currentIframe = (currentIframe + 1) % webAds.length;
          startWebAds();
        }
      }, 1000);
    }

    // Helper for incrementing numeric fields safely
    function incrementField(field, value) {
      return { [field]: (currentUserData()[field] || 0) + value };
    }

    function currentUserData() {
      return window.userData || {};
    }

  </script>

  <style>
    body { font-family: Arial, sans-serif; background: #f8f8f8; margin: 0; padding: 0; }
    header { background: #1a73e8; color: white; padding: 1rem; text-align: center; }
    #dashboard { display: none; padding: 1rem; }
    #auth-section { display: none; text-align: center; margin-top: 50px; }
    button { padding: 0.5rem 1rem; margin: 0.5rem; cursor: pointer; }
    iframe { width: 100%; height: 300px; border: none; margin-top: 1rem; }
    .stats { display: flex; justify-content: space-around; margin-top: 1rem; }
    .card { background: white; padding: 1rem; border-radius: 8px; width: 18%; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.1);}
  </style>
</head>
<body>

<header>
  <h1>Ad4U Dashboard</h1>
  <button id="login-btn">Login with Google</button>
  <button id="logout-btn">Logout</button>
</header>

<!-- AUTH -->
<div id="auth-section">
  <h2>Please Login to Continue</h2>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <h2>Welcome, <span id="displayName"></span></h2>
  <div class="stats">
    <div class="card">Coins: <span id="coins">0</span></div>
    <div class="card">Web Traffic: <span id="W_coins">0</span></div>
    <div class="card">Direct Links: <span id="D_coins">0</span></div>
    <div class="card">YT Views: <span id="yt_views">0</span></div>
    <div class="card">YT Watch Sec: <span id="yt_watch_seconds">0</span></div>
    <div class="card">Premium: <span id="premiumStatus">Free ❌</span></div>
  </div>

  <h3>Web Traffic Ads</h3>
  <iframe id="web-iframe"></iframe>
  <p>Time remaining: <span id="web-timer">0</span> sec</p>

  <button onclick="startWebAds()">Start Earning Coins</button>

</div>

</body>
</html>
