<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ad4U - Earn & Launch Ads</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:900,700,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    :root { --main-bg: linear-gradient(135deg, #232f3e 0%, #2563eb 100%); --card-bg: rgba(255,255,255,0.92);
      --accent: #2563eb; --accent2: #facc15; --radius: 18px; --shadow: 0 12px 48px #232f3e40;
      --glass: rgba(255,255,255,0.7); --neon: 0 0 10px #facc15, 0 0 20px #2563eb;
    }
    html, body { height:100%; width:100%; margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Montserrat',Arial,sans-serif; background: var(--main-bg); min-height:100vh; color: #222; letter-spacing: 0.01em; }
    header { background: rgba(35,47,62,0.91); color: #fff; backdrop-filter: blur(5px); padding: 1.3rem 2rem 1.1rem 2rem;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; border-radius: 0 0 var(--radius) var(--radius); box-shadow: var(--shadow); z-index: 3; position:relative;}
    .logo { font-weight: 900; font-size: 2.1rem; letter-spacing: 0.1em; text-shadow: var(--neon);}
    nav { display: flex; gap: 1.3em; flex-wrap: wrap;}
    nav a { color: #fff; text-decoration: none; font-weight: 700; letter-spacing: 0.04em; padding: 0.5em 1em; border-radius: 8px; transition:.14s; background: none; display: inline-block; margin-bottom: 3px; }
    nav a.active, nav a:hover { background: var(--accent); box-shadow: 0 0 8px #2563eb60;}
    .coins { background: var(--accent2); color: #232f3e; padding: 0.33em 0.95em; border-radius: 6px; margin-left: 1em; font-weight:900; }
    main { max-width: 1180px; margin: 2.3em auto 1em auto; padding: 2.2em 1.2em; background: var(--glass); border-radius: var(--radius); box-shadow: var(--shadow); min-height: 72vh; position:relative; z-index:1;}
    .card { background: var(--card-bg); border-radius: var(--radius); box-shadow: 0 4px 22px #232f3e18; padding: 2em 2em 1.5em 2em; margin-bottom: 2em; position: relative; transition:.16s;}
    .card h2, .card h3 { margin-top: 0; margin-bottom: 0.7em; }
    .btn { background: var(--accent); color: #fff; border: none; font-weight: 700; font-size: 1.07em; padding: 0.7em 1.5em; border-radius: 1em; margin: 0.7em 0; cursor: pointer; box-shadow: 0 2px 8px #2563eb23; transition:.14s; letter-spacing: 0.04em;}
    .btn[disabled], .btn.disabled { background: #b0b0b0; cursor: not-allowed; }
    .btn.gold { background: var(--accent2); color: #232f3e; font-weight:900; }
    .btn.whatsapp { background: #25d366; color:#fff; font-weight:900; font-size:1.1em; display: flex; align-items: center; gap: 0.5em;}
    .hidden { display: none !important; }
    .iframe-ads-grid { display: flex; flex-wrap: wrap; gap: 1.2em; margin: 1em 0; justify-content:center;}
    .iframe-ads-grid iframe { border: 3px solid var(--accent); border-radius: 12px; min-width: 290px; min-height: 190px; box-shadow: 0 2px 18px #2563eb20; flex: 1 1 340px; background: #fff; transition: 0.3s box-shadow;}
    .iframe-ads-grid iframe:focus, .iframe-ads-grid iframe:hover { box-shadow:0 0 18px #facc1570, 0 0 6px #2563eb;}
    .notif { background: #fef3c7; color: #b45309; border-left: 5px solid var(--accent2); padding: 1.1em 1.2em; border-radius: 7px; margin: 1.2em 0; font-weight:800; }
    .notif.error { background: #fee2e2; color: #b91c1c; border-left: 5px solid #b91c1c;}
    @media (max-width:900px){ main {padding: 1em;} .iframe-ads-grid { flex-direction:column;} }
    @media (max-width:600px){ header, main, .card {padding: 1em;} .card {padding: 1em;} nav {gap:0.3em;} .iframe-ads-grid iframe{min-width:200px;} }
  </style>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
<header>
  <span class="logo">Ad4U</span>
  <nav>
    <a href="#dashboard" id="nav-dashboard">Dashboard</a>
    <a href="#webtraffic" id="nav-webtraffic">Website Traffic</a>
    <a href="#ytwatch" id="nav-ytwatch">YT Watchtime</a>
    <a href="#ytviews" id="nav-ytviews">YT Views</a>
    <a href="#directlink" id="nav-directlink">Direct Link</a>
    <a href="#launch" id="nav-launch">Launch Ad</a>
    <a href="#account" id="nav-account">Account</a>
    <a href="#" id="logout-btn" class="hidden">Logout</a>
    <a href="#" id="login-btn">Login with Google</a>
  </nav>
  <span id="user-coins" class="coins"></span>
</header>
<main>
  <section id="page-webtraffic" class="card">
    <h2>Website Traffic</h2>
    <div class="multi-ads-controls">
      <label>
        <b>How many ads you want to watch at once?</b>
        <input id="web-multi-count" type="number" min="1" max="10" value="1">
        <button class="btn" id="web-multi-btn">Go</button>
      </label>
    </div>
    <div id="web-ads-grid" class="iframe-ads-grid"></div>
    <div id="web-notif"></div>
  </section>
  <section id="page-ytwatch" class="card hidden">
    <h2>YouTube Watchtime</h2>
    <div class="multi-ads-controls">
      <label>
        <b>How many videos you want to watch at once?</b>
        <input id="ytwatch-multi-count" type="number" min="1" max="10" value="1">
        <button class="btn" id="ytwatch-multi-btn">Go</button>
      </label>
    </div>
    <div id="ytwatch-ads-grid" class="iframe-ads-grid"></div>
    <div id="ytwatch-notif"></div>
  </section>
  <section id="page-ytviews" class="card hidden">
    <h2>YouTube Views</h2>
    <div class="multi-ads-controls">
      <label>
        <b>How many videos you want to view at once?</b>
        <input id="ytviews-multi-count" type="number" min="1" max="10" value="1">
        <button class="btn" id="ytviews-multi-btn">Go</button>
      </label>
    </div>
    <div id="ytviews-ads-grid" class="iframe-ads-grid"></div>
    <div id="ytviews-notif"></div>
  </section>
  <section id="page-directlink" class="card hidden">
    <h2>Direct Link Ads</h2>
    <div id="directlink-list"></div>
    <div id="directlink-notif"></div>
  </section>
  <section id="page-launch" class="card hidden">
    <h2>Launch Your Ad</h2>
    <form id="ad-launch-form" autocomplete="off" style="margin-bottom:1.2em;">
      <select id="launch-type">
        <option value="web">Website Traffic</option>
        <option value="ytwatch">YouTube Watchtime</option>
        <option value="ytviews">YouTube Views</option>
        <option value="dlink">Direct Link</option>
      </select>
      <input type="url" id="launch-url" placeholder="Ad URL" required>
      <input type="number" id="launch-budget" placeholder="Budget (coins)" required>
      <button type="submit" class="btn gold">Launch (15% fee)</button>
    </form>
    <div id="launch-msg"></div>
    <h3>Your Running Ads</h3>
    <ul id="your-ads-list"></ul>
  </section>
  <!-- (Add here the rest of your SPA subpages as needed) -->
</main>
<script>
// =========== FIREBASE CONFIG ===========
const firebaseConfig = {
  apiKey: "AIzaSyAnu49G3ZZaMhRAYwoBPKfcRoj7sfcu5E8",
  authDomain: "ad-4-u.firebaseapp.com",
  projectId: "ad-4-u",
  storageBucket: "ad-4-u.appspot.com",
  messagingSenderId: "775864010731",
  appId: "1:775864010731:web:ea8a2ff4f772ca80ac3bae",
  measurementId: "G-3R9DDSM2XK"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ========== DEMO ADS ==========
const DEMO_ADS = {
  web: [
    { url: "http://cludymovie.com/", id: "demo1", owner: "system", demo: true },
    { url: "https://newswithsk.com", id: "demo2", owner: "system", demo: true }
  ],
  dlink: [
    { url: "https://otieu.com/4/9677163", id: "demo3", owner: "system", demo: true },
    { url: "https://otieu.com/4/9677163", id: "demo4", owner: "system", demo: true }
  ],
  yt: [
    { url: "https://www.youtube.com/embed/Uw9bqrrV-yI", id: "demo5", owner: "system", demo: true }
  ]
};

async function fetchUserAds(type) {
  const snap = await db.collection('ads').where('type', '==', type).where('active','==',true).where('budget','>',0).get();
  return snap.docs.map(doc => ({ ...doc.data(), id: doc.id, demo: false }));
}
function rotateDemo(arr, n) {
  const now = Math.floor(Date.now() / 1000);
  const group = Math.floor(now / 120);
  let start = group % arr.length;
  let out = [];
  for (let i = 0; i < n; i++) out.push(arr[(start + i) % arr.length]);
  return out;
}
function pickAds(type, n, userAds) {
  let demoList = rotateDemo(DEMO_ADS[type], n);
  let others = userAds.filter(a=>!a.demo);
  let all = [];
  let used = {};
  for (let i=0; i<n && (demoList.length||others.length); i++) {
    let ad = others.length ? others.splice(Math.floor(Math.random()*others.length),1)[0] : demoList.shift();
    if(ad&&!used[ad.id]) { all.push(ad); used[ad.id]=1; }
  }
  while(all.length<n) {
    let d = demoList.shift();
    if(d && !used[d.id]) { all.push(d); used[d.id]=1; }
  }
  return all;
}
async function showWebTrafficAds(n) {
  const userAds = await fetchUserAds("web");
  const ads = pickAds("web", n, userAds);
  let html = '';
  ads.forEach((ad,idx) => {
    html += `<div style="display:inline-block;vertical-align:top;">
      <iframe src="${ad.url}" id="web-iframe-${idx}" data-adid="${ad.id}"></iframe>
      <div style="text-align:center;">
        <button class="btn" id="web-earn-${idx}" data-adid="${ad.id}" disabled>Wait 30s</button>
      </div></div>`;
  });
  document.getElementById("web-ads-grid").innerHTML = html;
  ads.forEach((ad,idx)=>{
    let btn = document.getElementById("web-earn-"+idx);
    btn.disabled=true;
    let t=30;
    btn.textContent="Wait 30s";
    let timer = setInterval(()=>{
      t--;
      btn.textContent = t>0?"Wait "+t+"s":"Earn 100";
      if(t<=0){
        btn.disabled=false; clearInterval(timer);
      }
    },1000);
    btn.onclick = async function(){
      btn.disabled=true;
      if(!ad.demo) await earnAd(ad.id,"web",100);
      btn.textContent="Earned!";
      setTimeout(()=>{btn.parentNode.parentNode.remove()},1200);
    };
  });
}
async function showYTAds(n, mode="yt") {
  const userAds = await fetchUserAds(mode == "yt" ? "ytwatch" : "ytviews");
  const ads = pickAds("yt", n, userAds);
  let html = '';
  ads.forEach((ad,idx) => {
    let url = ad.url.includes("embed") ? ad.url : "https://www.youtube.com/embed/" + getYTId(ad.url);
    html += `<div style="display:inline-block;vertical-align:top;">
      <iframe src="${url}" id="${mode}-iframe-${idx}" data-adid="${ad.id}" allow="autoplay" allowfullscreen></iframe>
      <div style="text-align:center;">
        <button class="btn" id="${mode}-earn-${idx}" data-adid="${ad.id}" disabled>${mode=="yt"?"Wait 60s":"Wait 10s"}</button>
      </div></div>`;
  });
  document.getElementById(mode=="yt"?"ytwatch-ads-grid":"ytviews-ads-grid").innerHTML = html;
  ads.forEach((ad,idx)=>{
    let btn = document.getElementById(`${mode}-earn-${idx}`);
    btn.disabled=true;
    let t=mode=="yt"?60:10;
    btn.textContent = mode=="yt"?"Wait 60s":"Wait 10s";
    let played = false, timer, ytapi=false, lastState=2;
    function startTimer(){
      if(timer)clearInterval(timer);
      timer=setInterval(()=>{
        t--; btn.textContent = t>0?`Wait ${t}s`:"Earn "+(mode=="yt"?100:10);
        if(t<=0){ btn.disabled=false; clearInterval(timer);}
      },1000);
    }
    let frame = document.getElementById(`${mode}-iframe-${idx}`);
    if (ad.url.includes("youtube") && !ad.demo) {
      window.onYouTubeIframeAPIReady = function(){
        var player = new YT.Player(frame, {
          events: {
            'onStateChange': function(event) {
              if(event.data===1 && !played){ played=true; startTimer(); }
              if(event.data!==1 && timer){ clearInterval(timer); }
            }
          }
        });
      };
      if (!window.YT) {
        let tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.body.appendChild(tag);
      } else {
        window.onYouTubeIframeAPIReady();
      }
    } else {
      startTimer();
    }
    btn.onclick = async function(){
      btn.disabled=true;
      if(!ad.demo) await earnAd(ad.id,mode=="yt"?"ytwatch":"ytviews",mode=="yt"?100:10);
      btn.textContent="Earned!";
      setTimeout(()=>{btn.parentNode.parentNode.remove()},1200);
    };
  });
}
function getYTId(url) {
  let id = url.split("v=")[1]?.split("&")[0];
  if (!id && url.includes("youtu.be/")) id = url.split("youtu.be/")[1]?.split("?")[0];
  return id || "";
}
function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]); }
async function showDirectLinkAds(){
  let userAds = await fetchUserAds("dlink");
  let ads = DEMO_ADS.dlink.concat(shuffle(userAds));
  let idx=0,list=document.getElementById("directlink-list");
  function showNext(){
    if(idx>=ads.length){list.innerHTML="<div class='notif'>All links done.</div>";return;}
    let ad=ads[idx];
    list.innerHTML=`<a href="${ad.url}" target="_blank" id="dlink-link">Open Link</a>
      <button class="btn" id="dlink-earn" disabled>Wait 15s</button>`;
    let btn = document.getElementById("dlink-earn");
    btn.disabled=true; let t=15;
    btn.textContent="Wait 15s";
    let timer = setInterval(()=>{
      t--;
      btn.textContent = t>0?"Wait "+t+"s":"Earn 200";
      if(t<=0){
        btn.disabled=false; clearInterval(timer);
      }
    },1000);
    btn.onclick = async function(){
      btn.disabled=true;
      if(!ad.demo) await earnAd(ad.id,"dlink",200);
      btn.textContent="Earned!";
      setTimeout(()=>{idx++;showNext();},1200);
    };
  }
  showNext();
}
async function earnAd(adid,type,amount){
  let adRef = db.collection('ads').doc(adid);
  await db.runTransaction(async tx=>{
    let adSnap = await tx.get(adRef);
    if(!adSnap.exists)return;
    let budget=adSnap.data().budget,views=adSnap.data().views||0;
    if(budget<amount)return;
    tx.update(adRef,{
      budget:budget-amount,
      views:views+1,
      active:(budget-amount)>0
    });
    let userRef = db.collection('users').doc(firebase.auth().currentUser.uid);
    let userSnap = await tx.get(userRef);
    tx.update(userRef,{
      coins:(userSnap.data().coins||0)+amount
    });
    let referredBy = userSnap.data().referredBy;
    if(referredBy){
      let refRef = db.collection('users').doc(referredBy);
      let refSnap = await tx.get(refRef);
      tx.update(refRef,{
        coins:(refSnap.data().coins||0)+Math.floor(amount*0.15)
      });
    }
  });
}
document.getElementById("web-multi-btn").onclick = ()=>showWebTrafficAds(Number(document.getElementById("web-multi-count").value)||1);
document.getElementById("ytwatch-multi-btn").onclick = ()=>showYTAds(Number(document.getElementById("ytwatch-multi-count").value)||1,"yt");
document.getElementById("ytviews-multi-btn").onclick = ()=>showYTAds(Number(document.getElementById("ytviews-multi-count").value)||1,"ytviews");

window.addEventListener("hashchange",()=>{
  let pg = location.hash.replace("#","");
  if(pg==="webtraffic") showWebTrafficAds(Number(document.getElementById("web-multi-count").value)||1);
  if(pg==="ytwatch") showYTAds(Number(document.getElementById("ytwatch-multi-count").value)||1,"yt");
  if(pg==="ytviews") showYTAds(Number(document.getElementById("ytviews-multi-count").value)||1,"ytviews");
  if(pg==="directlink") showDirectLinkAds();
});
window.addEventListener("DOMContentLoaded",()=>{
  showWebTrafficAds(1);
  showYTAds(1,"yt");
  showYTAds(1,"ytviews");
  showDirectLinkAds();
});
</script>
</body>
</html>
