<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Exchange Platform - Free & Paid Services</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
            min-height: 100vh;
        }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f7f7f7; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Custom styles for interactive elements */
        .btn-primary {
            @apply bg-indigo-600 text-white py-2 px-4 rounded-lg shadow-md hover:bg-indigo-700 transition duration-300;
        }
        .nav-item {
            @apply cursor-pointer p-3 rounded-xl hover:bg-indigo-100 transition duration-150 text-gray-700 font-medium;
        }
        .nav-item.active {
            @apply bg-indigo-600 text-white shadow-lg hover:bg-indigo-700;
        }
        /* Style for the ad iframe */
        #adIframe, #ytIframe {
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            width: 100%;
            height: 400px;
            background-color: #f8fafc;
        }
        /* Custom modal overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
    </style>
</head>
<body>

    <!-- Main Application Container -->
    <div id="app" class="flex flex-col min-h-screen">
        <!-- Header/Navigation is rendered here -->
    </div>

    <!-- Modals are rendered here -->
    <div id="modal-container"></div>

    <!-- Firebase Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, query, where, addDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global configuration variables from the environment
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyCUnWnmNHHJPFKzkyJ59-cK8kag6OpIoIM",
            authDomain: "website-5636d.firebaseapp.com",
            projectId: "website-5636d",
            storageBucket: "website-5636d.firebasestorage.app",
            messagingSenderId: "737574321288",
            appId: "1:737574321288:web:e92da5e5b4d63b87d8b33d",
            measurementId: "G-S64W6JR12C"
        };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // Admin (Premium) Ads - will be shown every 2 minutes
        const ADMIN_ADS = {
            web: [
                'https://cludymovie.com',
                'https://newswithsk.com',
                'https://gewnews.com',
            ],
            direct_link: [
                'https://otieu.com/4/9677163',
                'https://otieu.com/4/9677167'
            ],
            yt_watch_time: [
                'https://www.youtube.com/embed/7X6tWXDminE?autoplay=1&mute=1&controls=0&disablekb=1&modestbranding=1&rel=0&iv_load_policy=3',
            ],
            yt_views: [
                'https://www.youtube.com/embed/7X6tWXDminE?autoplay=1&mute=1&controls=0&disablekb=1&modestbranding=1&rel=0&iv_load_policy=3',
            ]
        };
        const PREMIUM_AD_INTERVAL_MS = 120000; // 2 minutes

        // Application State Management Class
        class AdExchangeApp {
            constructor() {
                this.db = null;
                this.auth = null;
                this.userId = null;
                this.isAuthReady = false;

                this.state = {
                    currentView: 'Dashboard',
                    user: null, // User profile data from Firestore
                    ads: [],    // List of active ads
                    referrals: [], // Referral data
                    webAdIndex: 0,
                    ytAdIndex: 0,
                    ytPlaying: false,
                    ytInterval: null,
                    adCountdown: 15,
                    premiumAdActive: false,
                };

                this.views = {
                    'Dashboard': this.renderDashboard,
                    'Web Traffic': this.renderWebTraffic,
                    'Direct Link': this.renderDirectLink,
                    'Youtube Watch Time': this.renderYoutubeWatchTime,
                    'Youtube Views': this.renderYoutubeViews,
                    'Referral System': this.renderReferralSystem,
                    'Ad Launch': this.renderAdLaunch,
                };

                this.activeIntervals = [];

                this.init();
            }

            async init() {
                try {
                    setLogLevel('Debug');
                    const app = initializeApp(firebaseConfig);
                    this.db = getFirestore(app);
                    this.auth = getAuth(app);

                    // Authentication setup
                    await this.handleAuth();

                    // Initial render (will wait for auth to fully complete)
                    onAuthStateChanged(this.auth, (user) => {
                        this.isAuthReady = true;
                        if (user) {
                            this.userId = user.uid;
                            this.setupFirestoreListeners();
                        } else {
                            this.userId = 'anonymous'; // Fallback for anonymous state
                            this.state.user = { W_coins: 0, D_coins: 0, Ultra_coins: 0, yt_hours: 0, yt_minutes: 0, yt_seconds: 0, yt_views: 0, referral_commissions: 0 };
                            this.render();
                        }
                    });

                    this.startAdRotationTimers();

                } catch (error) {
                    console.error("Firebase/App initialization error:", error);
                    this.showErrorModal(`App initialization failed: ${error.message}`);
                }
            }

            async handleAuth() {
                try {
                    if (initialAuthToken) {
                        await signInWithCustomToken(this.auth, initialAuthToken);
                        console.log("Signed in with custom token.");
                    } else {
                        await signInAnonymously(this.auth);
                        console.log("Signed in anonymously.");
                    }
                } catch (error) {
                    console.error("Auth error, signing in anonymously as fallback:", error);
                    await signInAnonymously(this.auth);
                }
            }

            // --- Firestore Operations and Listeners ---

            getUserDocRef(uid) {
                return doc(this.db, 'artifacts', appId, 'public', 'data', 'users', uid);
            }

            getAdsCollectionRef() {
                return collection(this.db, 'artifacts', appId, 'public', 'data', 'ads');
            }

            getReferralsCollectionRef() {
                 return collection(this.db, 'artifacts', appId, 'public', 'data', 'referrals');
            }

            setupFirestoreListeners() {
                // User Data Listener
                onSnapshot(this.getUserDocRef(this.userId), (doc) => {
                    if (doc.exists()) {
                        this.state.user = doc.data();
                    } else {
                        // Create initial user document if it doesn't exist
                        this.state.user = { W_coins: 0, D_coins: 0, Ultra_coins: 0, yt_hours: 0, yt_minutes: 0, yt_seconds: 0, yt_views: 0, referral_commissions: 0, is_premium: false };
                        setDoc(this.getUserDocRef(this.userId), this.state.user, { merge: true });
                    }
                    this.render();
                }, (error) => {
                    console.error("User data snapshot error:", error);
                });

                // Ads Data Listener
                onSnapshot(this.getAdsCollectionRef(), (snapshot) => {
                    this.state.ads = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    this.render();
                }, (error) => {
                    console.error("Ads data snapshot error:", error);
                });

                // Referrals Data Listener
                onSnapshot(query(this.getReferralsCollectionRef(), where('referrer_id', '==', this.userId)), (snapshot) => {
                    this.state.referrals = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    this.render();
                }, (error) => {
                    console.error("Referral data snapshot error:", error);
                });
            }

            async createNewAd(type, link, budget, costPerUnit) {
                if (!this.state.user) return this.showErrorModal("User data not loaded.");
                const balanceKey = type === 'web' || type === 'direct_link' ? 'W_coins' : 'W_coins'; // Use W_coins for simplicity of initial balance check

                if (this.state.user[balanceKey] < budget) {
                    return this.showErrorModal(`Insufficient ${balanceKey}. Required: ${budget}, Available: ${this.state.user[balanceKey]}`);
                }

                try {
                    await updateDoc(this.getUserDocRef(this.userId), {
                        [balanceKey]: this.state.user[balanceKey] - budget
                    });

                    await addDoc(this.getAdsCollectionRef(), {
                        type,
                        link,
                        budget,
                        spent: 0,
                        cost_per_unit: costPerUnit,
                        user_id: this.userId,
                        status: 'active',
                        created_at: Date.now(),
                        impressions_left: Math.floor(budget / costPerUnit)
                    });

                    this.showSuccessModal("Ad launched successfully!");
                } catch (error) {
                    console.error("Error creating ad:", error);
                    this.showErrorModal(`Failed to launch ad: ${error.message}`);
                    // Optionally, revert coins if transaction failed
                }
            }

            async collectReferralCommission() {
                if (!this.state.user) return this.showErrorModal("User data not loaded.");

                const commission = this.state.user.referral_commissions || 0;
                if (commission <= 0) {
                    return this.showErrorModal("No pending commissions to collect.");
                }

                try {
                    await updateDoc(this.getUserDocRef(this.userId), {
                        W_coins: (this.state.user.W_coins || 0) + commission,
                        referral_commissions: 0 // Reset pending commission
                    });
                    this.showSuccessModal(`Collected ${commission} W coins! Commission balance reset.`);
                } catch (error) {
                    console.error("Error collecting commission:", error);
                    this.showErrorModal(`Failed to collect commission: ${error.message}`);
                }
            }

            // --- Real-time Logic ---

            clearAllIntervals() {
                this.activeIntervals.forEach(clearInterval);
                this.activeIntervals = [];
            }

            startAdRotationTimers() {
                this.clearAllIntervals();

                // 1. Web Traffic Ad Rotation Timer
                const webTrafficTimer = setInterval(() => {
                    if (this.state.currentView === 'Web Traffic' && this.state.user) {
                        this.state.adCountdown -= 1;
                        if (this.state.adCountdown <= 0) {
                            this.earnCoins('W', 500, 'Web Traffic Watch');
                            this.state.adCountdown = 15;
                            this.state.webAdIndex = (this.state.webAdIndex + 1) % (this.getActiveWebAds().length + (this.state.premiumAdActive ? ADMIN_ADS.web.length : 0));
                            this.updateAdState('Web Traffic');
                        }
                    }
                    if (document.getElementById('countdown')) {
                         document.getElementById('countdown').textContent = `Next ad in ${this.state.adCountdown}s`;
                    }
                    this.renderHeader(); // Ensure header coin updates are responsive
                }, 1000);
                this.activeIntervals.push(webTrafficTimer);


                // 2. Premium Ad Logic Timer
                const premiumTimer = setInterval(() => {
                    this.state.premiumAdActive = true;
                    // For a real app, this would deduct Ultra_coins here
                    // await updateDoc(this.getUserDocRef(this.userId), { Ultra_coins: this.state.user.Ultra_coins - 200 });
                    this.showSuccessModal("Premium Ad Activated: Enjoy special premium user ads for the next 2 minutes!");
                    this.render(); // Re-render to pick up new ad state

                    setTimeout(() => {
                        this.state.premiumAdActive = false;
                        this.render();
                    }, PREMIUM_AD_INTERVAL_MS - 2000); // Premium lasts almost 2 mins
                }, PREMIUM_AD_INTERVAL_MS); // Runs every 2 minutes
                this.activeIntervals.push(premiumTimer);

            }

            startYoutubeTimer() {
                if (this.state.ytInterval) clearInterval(this.state.ytInterval);

                const timer = setInterval(() => {
                    if (this.state.ytPlaying) {
                        this.state.user.yt_seconds++;
                        if (this.state.user.yt_seconds >= 60) {
                            this.state.user.yt_seconds = 0;
                            this.state.user.yt_minutes++;
                        }
                        if (this.state.user.yt_minutes >= 60) {
                            this.state.user.yt_minutes = 0;
                            this.state.user.yt_hours++;
                        }
                        this.renderHeader();
                        this.renderYoutubeWatchTime();
                    }
                }, 1000);
                this.activeIntervals.push(timer);
                this.state.ytInterval = timer;
            }

            stopYoutubeTimer() {
                if (this.state.ytInterval) {
                    clearInterval(this.state.ytInterval);
                    this.state.ytInterval = null;
                }
            }

            // --- Coin/Reward Earning Functions ---

            async earnCoins(type, amount, source, refereeId = null) {
                if (!this.state.user) return this.showErrorModal("Cannot earn coins: User not logged in.");
                const coinKey = type === 'W' ? 'W_coins' : 'D_coins';

                const updates = {
                    [coinKey]: (this.state.user[coinKey] || 0) + amount
                };

                // Commission logic for the referrer
                if (refereeId) {
                    const commissionAmount = Math.floor(amount * 0.15); // 15% commission
                    const refereeDocRef = this.getUserDocRef(refereeId);

                    await updateDoc(refereeDocRef, {
                        referral_commissions: (this.state.user.referral_commissions || 0) + commissionAmount
                    });
                }

                try {
                    await updateDoc(this.getUserDocRef(this.userId), updates);
                    this.showToast(`+${amount} ${type} coins earned from ${source}!`, 'success');
                } catch (error) {
                    console.error("Error earning coins:", error);
                    this.showErrorModal(`Error earning coins: ${error.message}`);
                }
            }

            // --- Authentication/UI Helpers ---

            async handleAuthAction(action, email, password) {
                this.closeModal();
                try {
                    const auth = getAuth(initializeApp(firebaseConfig));
                    let userCredential;

                    if (action === 'signup') {
                        userCredential = await createUserWithEmailAndPassword(auth, email, password);
                        await this.initializeNewUser(userCredential.user.uid);
                    } else if (action === 'login') {
                        userCredential = await signInWithEmailAndPassword(auth, email, password);
                    } else if (action === 'google') {
                        const provider = new GoogleAuthProvider();
                        // This technically doesn't strictly enforce @gmail.com but uses the intended flow
                        userCredential = await signInWithPopup(auth, provider);
                        const isNewUser = userCredential.additionalUserInfo.isNewUser;
                        if (isNewUser) {
                             await this.initializeNewUser(userCredential.user.uid);
                        }
                    } else if (action === 'reset') {
                        await sendPasswordResetEmail(auth, email);
                        return this.showSuccessModal("Password reset link sent to your email!");
                    }

                    this.showSuccessModal(`Successfully ${action === 'signup' ? 'signed up' : 'logged in'}!`);
                    this.render();

                } catch (error) {
                    console.error(`Auth error during ${action}:`, error);
                    let message = error.message;
                    if (error.code === 'auth/email-already-in-use') { message = 'Email already in use.'; }
                    if (error.code === 'auth/invalid-email') { message = 'Invalid email address.'; }
                    if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') { message = 'Invalid credentials.'; }
                    this.showErrorModal(`Authentication Failed: ${message}`);
                }
            }

            async initializeNewUser(newUserId) {
                // Check for a referral code in the URL (not implemented in this simplified example)
                const referrerId = new URLSearchParams(window.location.search).get('ref');
                const initialData = {
                    W_coins: 10000, // Initial bonus coins
                    D_coins: 0,
                    Ultra_coins: 0,
                    yt_hours: 0, yt_minutes: 0, yt_seconds: 0,
                    yt_views: 0,
                    referral_commissions: 0,
                    is_premium: false
                };

                await setDoc(this.getUserDocRef(newUserId), initialData);

                if (referrerId) {
                    // Record the referral relationship
                    await addDoc(this.getReferralsCollectionRef(), {
                        referrer_id: referrerId,
                        referee_id: newUserId,
                        created_at: Date.now()
                    });
                    // Give referrer the sign-up bonus (10,000 W coins)
                    const referrerRef = this.getUserDocRef(referrerId);
                    await updateDoc(referrerRef, {
                        W_coins: (await getDoc(referrerRef)).data().W_coins + 10000
                    });
                }
            }

            async handleSignOut() {
                try {
                    this.stopYoutubeTimer();
                    await this.auth.signOut();
                    this.state.user = null;
                    this.userId = null;
                    this.showSuccessModal("Logged out successfully.");
                    this.render();
                } catch (error) {
                    console.error("Sign out error:", error);
                    this.showErrorModal("Failed to sign out.");
                }
            }

            changeView(view) {
                this.state.currentView = view;
                this.stopYoutubeTimer(); // Stop YT timer when changing view
                this.render();
            }

            // --- Rendering Core ---

            render() {
                const appDiv = document.getElementById('app');
                if (!appDiv) return;

                // Render Header (always visible)
                appDiv.innerHTML = this.renderHeader();

                // Render Main Content
                const contentDiv = document.createElement('main');
                contentDiv.id = 'main-content';
                contentDiv.className = 'flex-grow p-4 md:p-8';

                // Check for authentication readiness
                if (!this.isAuthReady || !this.userId) {
                    contentDiv.innerHTML = `<div class="text-center py-20"><p class="text-xl text-gray-500">Loading application...</p></div>`;
                    appDiv.appendChild(contentDiv);
                    return;
                }

                // Check for logged-in status
                if (!this.auth.currentUser || this.auth.currentUser.isAnonymous) {
                    contentDiv.innerHTML = this.renderAuthPrompt();
                    appDiv.appendChild(contentDiv);
                    return;
                }

                // Render the selected view content
                const renderFunction = this.views[this.state.currentView];
                if (renderFunction) {
                    contentDiv.innerHTML += `<div class="bg-white p-6 md:p-10 rounded-xl shadow-lg">${renderFunction.call(this)}</div>`;
                } else {
                    contentDiv.innerHTML += `<div class="text-center py-20"><p class="text-xl text-red-500">View not found: ${this.state.currentView}</p></div>`;
                }

                appDiv.appendChild(contentDiv);

                // Post-render setup for specific views (e.g., event listeners)
                this.postRenderSetup(this.state.currentView);
            }

            // --- UI Components ---

            renderHeader() {
                const { user, currentView } = this.state;
                const views = Object.keys(this.views);
                const isAuth = this.auth?.currentUser && !this.auth.currentUser.isAnonymous;

                const balanceDisplay = user ? `
                    <div class="flex flex-wrap justify-center md:justify-end gap-3 text-sm font-semibold">
                        <span class="bg-yellow-100 text-yellow-800 p-2 rounded-lg">W-Coins: ${user.W_coins?.toLocaleString() || 0}</span>
                        <span class="bg-blue-100 text-blue-800 p-2 rounded-lg">D-Coins: ${user.D_coins?.toLocaleString() || 0}</span>
                        <span class="bg-purple-100 text-purple-800 p-2 rounded-lg">Ultra: ${user.Ultra_coins?.toLocaleString() || 0}</span>
                        <span class="bg-green-100 text-green-800 p-2 rounded-lg">YT Time: ${user.yt_hours?.toLocaleString() || 0}h ${user.yt_minutes?.toLocaleString() || 0}m ${user.yt_seconds?.toLocaleString() || 0}s</span>
                        <span class="bg-red-100 text-red-800 p-2 rounded-lg">YT Views: ${user.yt_views?.toLocaleString() || 0}</span>
                    </div>
                ` : `<div class="text-sm text-gray-400">Sign in to view balances</div>`;

                return `
                    <header class="bg-white shadow-md sticky top-0 z-10">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                            <div class="flex flex-col md:flex-row justify-between items-center">
                                <h1 class="text-2xl font-extrabold text-indigo-600 mb-4 md:mb-0">Ad Exchange Pro</h1>
                                <div class="flex items-center space-x-4">
                                    ${balanceDisplay}
                                    ${isAuth ?
                                        `<button onclick="app.handleSignOut()" class="bg-red-500 text-white py-1 px-3 rounded-lg text-sm hover:bg-red-600">Sign Out</button>`
                                        : `<button onclick="app.showAuthModal('login')" class="bg-green-500 text-white py-1 px-3 rounded-lg text-sm hover:bg-green-600">Sign In</button>`
                                    }
                                </div>
                            </div>
                            <nav class="mt-4 overflow-x-auto whitespace-nowrap pb-2">
                                <div class="flex space-x-3">
                                    ${views.map(view => `
                                        <button onclick="app.changeView('${view}')" class="nav-item ${currentView === view ? 'active' : ''}">
                                            ${view}
                                        </button>
                                    `).join('')}
                                </div>
                            </nav>
                        </div>
                    </header>
                `;
            }

            renderAuthPrompt() {
                return `
                    <div class="flex flex-col items-center justify-center py-20">
                        <h2 class="text-3xl font-bold text-gray-800 mb-6">Welcome!</h2>
                        <p class="text-gray-600 mb-8 max-w-md text-center">Please sign up or log in to access your dashboard and ad campaigns. We only accept Gmail accounts for security.</p>
                        <div class="flex space-x-4">
                            <button onclick="app.showAuthModal('login')" class="btn-primary">Login</button>
                            <button onclick="app.showAuthModal('signup')" class="bg-gray-200 text-gray-800 py-2 px-4 rounded-lg shadow-md hover:bg-gray-300 transition duration-300">Sign Up</button>
                            <button onclick="app.handleAuthAction('google')" class="bg-red-500 text-white py-2 px-4 rounded-lg shadow-md hover:bg-red-600 transition duration-300">Sign In with Google</button>
                        </div>
                    </div>
                `;
            }

            // --- Page Render Functions ---

            renderDashboard() {
                const { user, ads } = this.state;
                const totalAds = ads.length;
                const activeAds = ads.filter(a => a.status === 'active').length;
                const refLink = `${window.location.origin}?ref=${this.userId}`;

                return `
                    <h2 class="text-3xl font-extrabold text-gray-900 mb-6">Dashboard Summary</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                        <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-200">
                            <h3 class="font-semibold text-indigo-700">Total W-Coins</h3>
                            <p class="text-2xl font-bold text-indigo-900">${user.W_coins?.toLocaleString() || 0}</p>
                        </div>
                         <div class="bg-yellow-50 p-4 rounded-xl border border-yellow-200">
                            <h3 class="font-semibold text-yellow-700">Pending Commissions</h3>
                            <p class="text-2xl font-bold text-yellow-900">${user.referral_commissions?.toLocaleString() || 0}</p>
                            <button onclick="app.collectReferralCommission()" class="mt-2 text-xs bg-yellow-400 text-white py-1 px-2 rounded-lg hover:bg-yellow-500 transition">Collect</button>
                        </div>
                        <div class="bg-green-50 p-4 rounded-xl border border-green-200">
                            <h3 class="font-semibold text-green-700">Active Ads</h3>
                            <p class="text-2xl font-bold text-green-900">${activeAds}</p>
                        </div>
                        <div class="bg-red-50 p-4 rounded-xl border border-red-200">
                            <h3 class="font-semibold text-red-700">Lifetime Views Earned</h3>
                            <p class="text-2xl font-bold text-red-900">${user.yt_views?.toLocaleString() || 0}</p>
                        </div>
                    </div>

                    <h3 class="text-2xl font-bold text-indigo-600 mb-4">Your Plan Details</h3>
                    <div class="bg-indigo-50 p-6 rounded-xl border-l-4 border-indigo-600">
                        <p class="mb-3 text-lg font-medium text-gray-800">
                            Welcome to the **Free & Paid Ad Exchange** Platform. Here’s what you need to know:
                        </p>
                        <ul class="list-disc list-inside space-y-2">
                            <li><span class="font-bold text-red-700">Special Country Traffic:</span> You need to Use PC and Follow this link Instruction. After following this, you can get any country traffic in your Link. (Link: <a href="#country-guide" class="text-indigo-500 hover:text-indigo-700" onclick="alert('In a real app, this would open a guide page.'); return false;">Country Guide</a>)</li>
                            <li><span class="font-bold">Earning Coins:</span> Earn <span class="text-yellow-800">500 W-coins</span> per 15s web ad watch and <span class="text-blue-800">1000 D-coins</span> per direct link click.</li>

                }

                if (type === 'reset') {
                    this.handleAuthAction('reset', email);
                } else {
                    if (!password || password.length < 6) {
                        return this.showErrorModal("Password must be at least 6 characters long.");
                    }
                    this.handleAuthAction(type, email, password);
                }
            }

            showAdLaunchModal(type, name, cost, unit) {
                this.showModal(`
                    <h3 class="text-2xl font-bold text-indigo-600 mb-6">Launch ${name} Ad</h3>
                    <p class="text-sm text-gray-600 mb-4">Cost: ${cost.toLocaleString()} ${unit} per Unit (Unit is Impression, Click, View, or Second)</p>
                    <form id="adLaunchForm" onsubmit="event.preventDefault(); app.submitAdLaunch('${type}', ${cost})">
                        <div class="mb-4">
                            <label for="ad-link" class="block text-sm font-medium text-gray-700">Website/Video Link</label>
                            <input type="url" id="ad-link" class="mt-1 block w-full border border-gray-300 rounded-lg shadow-sm p-3" placeholder="https://yourlink.com or YouTube URL" required>
                        </div>
                        <div class="mb-6">
                            <label for="ad-budget" class="block text-sm font-medium text-gray-700">Total Budget (${unit})</label>
                            <input type="number" id="ad-budget" class="mt-1 block w-full border border-gray-300 rounded-lg shadow-sm p-3" min="${cost}" step="${cost}" required oninput="app.calculateImpressions(this.value, ${cost}, '${unit}')">
                        </div>
                        <p class="text-md font-bold text-green-600 mb-6">You will get: <span id="impression-count">0</span> Impressions/Units.</p>
                        <button type="submit" class="w-full btn-primary">Launch Ad Campaign</button>
                    </form>
                    <button onclick="app.closeModal()" class="mt-4 text-sm text-gray-500 w-full hover:text-gray-700">Cancel</button>
                `);
            }

            calculateImpressions(budget, cost, unit) {
                const countSpan = document.getElementById('impression-count');
                if (countSpan && budget) {
                    const impressions = Math.floor(parseInt(budget) / cost);
                    countSpan.textContent = `${impressions.toLocaleString()} ${unit.replace('-Coins', '')}${impressions === 1 ? '' : 's'}`;
                } else if (countSpan) {
                    countSpan.textContent = '0';
                }
            }

            submitAdLaunch(type, cost) {
                const link = document.getElementById('ad-link').value;
                const budget = parseInt(document.getElementById('ad-budget').value);

                if (!link || budget < cost) {
                    return this.showErrorModal("Please enter a valid link and a budget greater than the cost per unit.");
                }

                // NOTE: Cost per Unit (cost) is passed to the createNewAd function
                this.createNewAd(type, link, budget, cost);
                this.closeModal();
            }

            copyToClipboard(text) {
                const el = document.createElement('textarea');
                el.value = text;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                this.showToast('Copied to clipboard!', 'info');
            }

            postRenderSetup(view) {
                if (view === 'Web Traffic') {
                    // Force the initial ad load and timer update
                    this.updateAdState('Web Traffic');
                } else if (view === 'Youtube Watch Time') {
                    // Initialize the YouTube timer display
                    if (this.state.ytPlaying) {
                        this.startYoutubeTimer();
                    } else {
                        this.stopYoutubeTimer();
                    }
                }
            }
        }

        // Initialize the app globally
        window.app = new AdExchangeApp();
    </script>
</body>
</html>
