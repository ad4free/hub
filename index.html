<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>StreamFlix</title>
  <meta name="description" content="Watch movies and series via embedded iframe players. Dark Netflix-like UI with categories."/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#000;
      --text:#fff;
      --muted:#b3b3b3;
      --accent:#e50914;
      --accent2:#b20710;
      --shadow: 0 24px 90px rgba(0,0,0,.75);
      --max: 1320px;
      --r12:12px;
      --r16:16px;
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x:hidden;
    }
    a{ color:inherit; text-decoration:none; }
    button{ font-family:inherit; }

    /* Intro splash (custom, not Netflix) */
    .intro{
      position: fixed; inset:0;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index: 999;
      overflow:hidden;
    }
    .intro.hidden{ display:none; }
    .intro::before{
      content:"";
      position:absolute; inset:-40%;
      background: radial-gradient(900px 600px at 50% 40%, rgba(229,9,20,.20), transparent 55%),
                  radial-gradient(700px 520px at 30% 70%, rgba(229,9,20,.12), transparent 60%);
      filter: blur(8px);
      opacity:.9;
    }
    .intro-logo{
      position:relative;
      display:flex;
      align-items:center;
      gap:14px;
      transform: translateY(6px);
      animation: introPop 1100ms ease forwards;
    }
    @keyframes introPop{
      0%{ opacity:0; transform: translateY(16px) scale(.98); }
      65%{ opacity:1; transform: translateY(0) scale(1.02); }
      100%{ opacity:1; transform: translateY(0) scale(1); }
    }
    .intro-mark{
      width: 48px; height: 48px;
      border-radius: 14px;
      background: linear-gradient(145deg, var(--accent), var(--accent2));
      box-shadow: 0 28px 90px rgba(229,9,20,.22);
      position:relative;
      overflow:hidden;
    }
    .intro-mark:after{
      content:"";
      position:absolute;
      inset: 11px 17px;
      border-left: 6px solid rgba(255,255,255,.88);
      border-right: 6px solid rgba(255,255,255,.30);
      transform: skewX(-10deg);
    }
    .intro-text{
      font-weight: 900;
      letter-spacing:.10em;
      text-transform: uppercase;
      font-size: 22px;
    }
    .intro-bar{
      position:absolute;
      bottom: 80px;
      width: min(520px, 86vw);
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,.10);
      overflow:hidden;
      border: 1px solid rgba(255,255,255,.06);
    }
    .intro-bar > div{
      height:100%;
      width:0%;
      background: linear-gradient(90deg, var(--accent), #ff4d55);
      border-radius: 999px;
      animation: loadBar 1200ms ease forwards;
    }
    @keyframes loadBar{ to{ width:100%; } }

    /* Nav */
    .nav{
      position: sticky; top:0; z-index: 30;
      background: linear-gradient(to bottom, rgba(0,0,0,.92), rgba(0,0,0,.55) 55%, rgba(0,0,0,0));
      border-bottom: 1px solid rgba(255,255,255,.04);
      backdrop-filter: blur(8px);
    }
    .nav-inner{
      max-width: var(--max);
      margin: 0 auto;
      padding: 14px 16px;
      display:flex;
      align-items:center;
      gap: 14px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 160px;
    }
    .brand .mark{
      width: 32px; height: 32px;
      border-radius: 10px;
      background: linear-gradient(145deg, var(--accent), var(--accent2));
      box-shadow: 0 18px 50px rgba(229,9,20,.22);
      position:relative;
    }
    .brand .mark:after{
      content:"";
      position:absolute;
      inset: 7px 11px;
      border-left: 5px solid rgba(255,255,255,.85);
      border-right: 5px solid rgba(255,255,255,.32);
      transform: skewX(-10deg);
    }
    .brand b{
      letter-spacing:.4px;
      font-weight: 900;
      text-transform: uppercase;
      font-size: 14px;
    }
    .nav-links{
      display:flex;
      gap: 14px;
      align-items:center;
      color: rgba(255,255,255,.88);
      font-weight: 650;
      font-size: 13px;
      overflow:auto;
      scrollbar-width:none;
    }
    .nav-links::-webkit-scrollbar{ display:none; }
    .nav-links a{ opacity:.88; transition: opacity .15s ease, color .15s ease; white-space: nowrap; }
    .nav-links a:hover{ opacity:1; color:#fff; }

    .nav-right{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap: 10px;
    }
    .search{
      display:flex;
      align-items:center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      min-width: 280px;
      transition: border-color .15s ease, background .15s ease;
    }
    .search:focus-within{
      border-color: rgba(229,9,20,.45);
      background: rgba(255,255,255,.07);
    }
    .search input{
      width:100%;
      background:transparent;
      border:0;
      outline:none;
      color: #fff;
      font-size: 13px;
    }
    .btn{
      border:0;
      cursor:pointer;
      border-radius: 999px;
      padding: 10px 12px;
      font-weight: 850;
      font-size: 13px;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
      user-select:none;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
    }
    .btn:hover{ transform: translateY(-1px); }

    /* Hero Carousel */
    .hero{
      position:relative;
      min-height: 70vh;
      display:flex;
      align-items:flex-end;
      overflow:hidden;
      border-bottom: 1px solid rgba(255,255,255,.06);
      isolation:isolate;
    }
    .hero-bg{
      position:absolute; inset:0;
      background-size: cover;
      background-position: center;
      filter: saturate(1.08) contrast(1.08);
      transform: scale(1.02);
      transition: opacity 600ms ease;
      opacity: 1;
      z-index:-2;
    }
    .hero-bg.fade{ opacity: 0; }
    .hero-overlay{
      position:absolute; inset:0;
      background:
        linear-gradient(to top, rgba(0,0,0,.95) 0%, rgba(0,0,0,.25) 55%, rgba(0,0,0,.75) 100%),
        radial-gradient(900px 520px at 25% 18%, rgba(229,9,20,.18), transparent 60%);
      z-index:-1;
    }
    .hero-inner{
      width:100%;
      max-width: var(--max);
      margin: 0 auto;
      padding: 110px 16px 18px;
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 14px;
      align-items:end;
    }
    .hero-title{
      margin:0;
      font-weight: 900;
      letter-spacing: -0.03em;
      font-size: clamp(26px, 3.2vw, 52px);
      line-height: 1.05;
      text-shadow: 0 18px 60px rgba(0,0,0,.7);
    }
    .hero-desc{
      margin: 10px 0 0;
      max-width: 70ch;
      color: rgba(255,255,255,.84);
      line-height: 1.55;
      font-size: 14px;
    }
    .hero-actions{
      margin-top: 14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .play{
      display:inline-flex; align-items:center; gap:10px;
      padding: 12px 16px;
      border-radius: 999px;
      border:0;
      cursor:pointer;
      font-weight: 900;
      background: #fff;
      color:#111;
      transition: transform .15s ease;
    }
    .play:hover{ transform: translateY(-1px); }
    .more{
      display:inline-flex; align-items:center; gap:10px;
      padding: 12px 16px;
      border-radius: 999px;
      cursor:pointer;
      font-weight: 900;
      background: rgba(109,109,110,.45);
      border: 1px solid rgba(255,255,255,.18);
      color:#fff;
      transition: transform .15s ease, background .15s ease;
    }
    .more:hover{ transform: translateY(-1px); background: rgba(109,109,110,.55); }

    .hero-side{
      border-radius: var(--r16);
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: var(--shadow);
      padding: 12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .stat{
      display:flex; align-items:baseline; justify-content:space-between;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.08);
    }
    .stat b{ font-size: 14px; }
    .stat span{ font-size: 12px; color: rgba(255,255,255,.72); }

    .dots{
      display:flex; gap:8px;
      justify-content:flex-end;
      margin-top: 10px;
    }
    .dot{
      width: 8px; height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.28);
      border: 1px solid rgba(255,255,255,.12);
    }
    .dot.active{
      background: rgba(229,9,20,.95);
      border-color: rgba(229,9,20,.4);
      box-shadow: 0 14px 40px rgba(229,9,20,.18);
    }

    /* Rows */
    .main{ max-width: var(--max); margin: 0 auto; padding: 14px 16px 60px; }
    .row{ margin-top: 18px; }
    .row-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      margin-bottom: 10px;
    }
    .row-head h2{ margin:0; font-size: 16px; letter-spacing:.2px; font-weight: 850; }
    .row-head .sub{ color: rgba(255,255,255,.65); font-size: 12px; }

    .cards{
      display:flex;
      gap: 10px;
      overflow:auto;
      padding: 6px 2px 12px;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.20) transparent;
    }
    .cards::-webkit-scrollbar{ height: 10px; }
    .cards::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.14); border-radius: 999px; }

    .card{
      width: 220px;
      flex: 0 0 auto;
      scroll-snap-align: start;
      border-radius: 10px;
      overflow:hidden;
      background: #111;
      border: 1px solid rgba(255,255,255,.08);
      cursor:pointer;
      position:relative;
      transform-origin: center;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .card:hover{
      transform: scale(1.10);
      z-index: 5;
      border-color: rgba(229,9,20,.35);
      box-shadow: 0 28px 90px rgba(0,0,0,.75);
    }
    .thumb{
      width:100%;
      aspect-ratio: 16/9;
      background:#090909;
      position:relative;
      overflow:hidden;
    }
    .thumb img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      transform: scale(1.02);
      transition: transform .25s ease, filter .25s ease;
      filter: saturate(1.05) contrast(1.05);
    }
    .card:hover .thumb img{
      transform: scale(1.10);
      filter: saturate(1.2) contrast(1.1);
    }
    .pill{
      position:absolute;
      top:10px; left:10px;
      background: rgba(229,9,20,.92);
      color:#fff;
      font-size: 11px;
      font-weight: 900;
      padding: 6px 10px;
      border-radius: 999px;
      letter-spacing:.06em;
      text-transform: uppercase;
      box-shadow: 0 18px 50px rgba(229,9,20,.18);
    }
    .meta{
      padding: 10px 10px 12px;
      display:flex;
      flex-direction:column;
      gap: 6px;
      min-height: 70px;
      background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0));
    }
    .title{
      margin:0;
      font-size: 13px;
      font-weight: 850;
      line-height:1.2;
      display:-webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow:hidden;
    }
    .desc{
      margin:0;
      font-size: 12px;
      color: rgba(255,255,255,.70);
      display:-webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow:hidden;
    }
    .empty{
      margin: 18px 0;
      padding: 16px;
      border-radius: 14px;
      background: rgba(255,255,255,.04);
      border: 1px dashed rgba(255,255,255,.15);
      color: rgba(255,255,255,.72);
    }

    /* Watch modal */
    .modal{
      position: fixed; inset:0;
      background: rgba(0,0,0,.75);
      display:none;
      align-items:flex-start;
      justify-content:center;
      padding: 14px;
      z-index: 60;
    }
    .modal.open{ display:flex; }
    .watch{
      width: min(1100px, 100%);
      border-radius: 14px;
      overflow:hidden;
      background: #0b0b0b;
      border:1px solid rgba(255,255,255,.10);
      box-shadow: var(--shadow);
    }
    .watch-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 12px 14px;
      background: rgba(0,0,0,.55);
      border-bottom: 1px solid rgba(255,255,255,.10);
    }
    .watch-top h3{ margin:0; font-size: 15px; font-weight: 900; }
    .xbtn{
      background: rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      color:#fff;
      border-radius: 999px;
      padding: 8px 12px;
      cursor:pointer;
      font-weight: 900;
    }
    .player{ width:100%; aspect-ratio: 16/9; background:#000; }
    .player iframe{ width:100%; height:100%; border:0; display:block; }
    .watch-body{ padding: 12px 14px 16px; display:flex; flex-direction:column; gap: 10px; }
    .chips{ display:flex; gap:8px; flex-wrap:wrap; }
    .chip{
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      color: rgba(255,255,255,.88);
      font-size: 12px;
      font-weight: 750;
    }
    .watch-desc{
      margin:0;
      color: rgba(255,255,255,.72);
      line-height: 1.55;
      font-size: 14px;
      white-space: pre-wrap;
    }

    @media (max-width: 980px){
      .hero-inner{ grid-template-columns: 1fr; padding-top: 90px; }
      .search{ min-width: 200px; }
      .card{ width: 200px; }
    }
    @media (max-width: 560px){
      .search{ display:none; }
      .brand{ min-width: auto; }
      .nav-links{ display:none; }
      .card{ width: 170px; }
      .hero{ min-height: 64vh; }
    }
  </style>
</head>

<body>
  <!-- Intro Splash -->
  <div class="intro" id="intro">
    <div class="intro-logo">
      <div class="intro-mark" aria-hidden="true"></div>
      <div class="intro-text">StreamFlix</div>
    </div>
    <div class="intro-bar" aria-hidden="true"><div></div></div>
  </div>

  <header class="nav">
    <div class="nav-inner">
      <div class="brand">
        <div class="mark" aria-hidden="true"></div>
        <b>StreamFlix</b>
      </div>

      <nav class="nav-links" aria-label="Primary">
        <a href="#home">Home</a>
        <a href="#tv">TV Shows</a>
        <a href="#movies">Movies</a>
        <a href="#new">New & Popular</a>
        <a href="#mylist">My List</a>
      </nav>

      <div class="nav-right">
        <div class="search" role="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M10.5 18.5a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z" stroke="rgba(255,255,255,.8)" stroke-width="2"/>
            <path d="M16.5 16.5 21 21" stroke="rgba(255,255,255,.8)" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="q" placeholder="Search titles, categories…" autocomplete="off"/>
        </div>

        <!-- optional: set your admin page URL -->
        <a class="btn" id="adminLink" href="#" rel="nofollow">Admin</a>
      </div>
    </div>
  </header>

  <section class="hero" id="home">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-overlay"></div>

    <div class="hero-inner">
      <div>
        <h1 class="hero-title" id="heroTitle">Loading…</h1>
        <p class="hero-desc" id="heroDesc">Fetching titles from database.</p>

        <div class="hero-actions">
          <button class="play" id="heroPlay"><span aria-hidden="true">▶</span> Play</button>
          <button class="more" id="heroMore"><span aria-hidden="true">i</span> More Info</button>
        </div>
      </div>

      <div class="hero-side">
        <div class="stat"><b id="statCount">0</b><span>Titles</span></div>
        <div class="stat"><b id="statCats">0</b><span>Categories</span></div>
        <div class="stat"><b>Auto Hero</b><span>Sliding banners</span></div>
        <div class="dots" id="dots"></div>
      </div>
    </div>
  </section>

  <main class="main">
    <div class="empty" id="loading">Loading…</div>
    <div id="rows"></div>
  </main>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="watch" role="dialog" aria-modal="true">
      <div class="watch-top">
        <h3 id="watchTitle">Title</h3>
        <button class="xbtn" id="closeBtn">Close</button>
      </div>
      <div class="player" id="player"></div>
      <div class="watch-body">
        <div class="chips"><span class="chip" id="watchCategory">Category</span></div>
        <p class="watch-desc" id="watchDesc"></p>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <script>
    // Firebase config (movie-46071)
    const firebaseConfig = {
      apiKey: "AIzaSyCYJHAqpECnD4q6syp_kC3g3LaS0aB1Mck",
      authDomain: "movie-46071.firebaseapp.com",
      databaseURL: "https://movie-46071-default-rtdb.firebaseio.com",
      projectId: "movie-46071",
      storageBucket: "movie-46071.firebasestorage.app",
      messagingSenderId: "651730685618",
      appId: "1:651730685618:web:904222ca24a3c5d4f203ab",
      measurementId: "G-YVVFT0R4DF"
    };

    // Optional: set your blogger admin page URL
    const ADMIN_PAGE_URL = "#";
    document.getElementById("adminLink").href = ADMIN_PAGE_URL;

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const $ = (id)=>document.getElementById(id);

    const els = {
      intro: $("intro"),
      q: $("q"),
      rows: $("rows"),
      loading: $("loading"),
      statCount: $("statCount"),
      statCats: $("statCats"),
      modal: $("modal"),
      closeBtn: $("closeBtn"),
      watchTitle: $("watchTitle"),
      watchDesc: $("watchDesc"),
      watchCategory: $("watchCategory"),
      player: $("player"),
      heroBg: $("heroBg"),
      heroTitle: $("heroTitle"),
      heroDesc: $("heroDesc"),
      heroPlay: $("heroPlay"),
      heroMore: $("heroMore"),
      dots: $("dots"),
    };

    // Cinematic wallpapers (fallback if you haven't added enough thumbnails yet)
    const FALLBACK_WALLPAPERS = [
      "https://images.unsplash.com/photo-1517602302552-471fe67acf66?auto=format&fit=crop&w=2400&q=70",
      "https://images.unsplash.com/photo-1478720568477-152d9b164e26?auto=format&fit=crop&w=2400&q=70",
      "https://images.unsplash.com/photo-1524985069026-dd778a71c7b4?auto=format&fit=crop&w=2400&q=70",
      "https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=2400&q=70",
      "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=2400&q=70"
    ];

    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
        .replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }

    function openWatch(item){
      els.watchTitle.textContent = item.title || "Untitled";
      els.watchDesc.textContent = item.description || "";
      els.watchCategory.textContent = item.category || "Uncategorized";
      els.player.innerHTML = item.iframe || "<div style='padding:18px;color:#bbb'>No iframe embed found.</div>";

      els.modal.classList.add("open");
      els.modal.setAttribute("aria-hidden","false");
      document.body.style.overflow = "hidden";
    }

    function closeWatch(){
      els.modal.classList.remove("open");
      els.modal.setAttribute("aria-hidden","true");
      els.player.innerHTML = "";
      document.body.style.overflow = "";
    }

    els.closeBtn.addEventListener("click", closeWatch);
    els.modal.addEventListener("click", (e)=>{ if (e.target === els.modal) closeWatch(); });
    window.addEventListener("keydown", (e)=>{ if (e.key === "Escape") closeWatch(); });

    function buildCard(item){
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <div class="thumb">
          <span class="pill">${esc(item.category || "Video")}</span>
          <img loading="lazy" alt="${esc(item.title || "Video")}"
               src="${esc(item.thumbnail || "")}"
               onerror="this.style.opacity=.25;this.alt='Thumbnail not found';"/>
        </div>
        <div class="meta">
          <p class="title">${esc(item.title || "Untitled")}</p>
          <p class="desc">${esc(item.description || "")}</p>
        </div>
      `;
      div.addEventListener("click", ()=>openWatch(item));
      return div;
    }

    function renderRows(items){
      els.rows.innerHTML = "";
      els.loading.style.display = "none";

      if (!items.length){
        els.rows.innerHTML = `<div class="empty">No titles yet. Open Admin and add videos.</div>`;
        els.statCount.textContent = "0";
        els.statCats.textContent = "0";
        return;
      }

      const map = new Map();
      for (const v of items){
        const c = (v.category || "Uncategorized").trim() || "Uncategorized";
        if (!map.has(c)) map.set(c, []);
        map.get(c).push(v);
      }

      const cats = Array.from(map.keys()).sort((a,b)=>a.localeCompare(b));
      els.statCount.textContent = String(items.length);
      els.statCats.textContent = String(cats.length);

      for (const cat of cats){
        const section = document.createElement("section");
        section.className = "row";
        section.innerHTML = `
          <div class="row-head">
            <div>
              <h2>${esc(cat)}</h2>
              <div class="sub">${map.get(cat).length} titles</div>
            </div>
          </div>
        `;
        const cards = document.createElement("div");
        cards.className = "cards";
        for (const it of map.get(cat)){
          cards.appendChild(buildCard(it));
        }
        section.appendChild(cards);
        els.rows.appendChild(section);
      }
    }

    let all = [];
    let heroItems = [];
    let heroIndex = 0;
    let heroTimer = null;

    function pickHeroItems(items){
      // Prefer items with thumbnails (best for hero)
      const withThumb = items.filter(v => (v.thumbnail || "").trim().length > 10);
      const base = (withThumb.length >= 6 ? withThumb : items).slice(0, 8);
      return base.length ? base : [];
    }

    function setHero(i){
      if (!heroItems.length) {
        els.heroTitle.textContent = "Welcome to StreamFlix";
        els.heroDesc.textContent = "Add titles from Admin to start showing banners and rows.";
        const w = FALLBACK_WALLPAPERS[Math.floor(Math.random()*FALLBACK_WALLPAPERS.length)];
        els.heroBg.style.backgroundImage = `url("${w}")`;
        els.dots.innerHTML = "";
        return;
      }

      heroIndex = (i + heroItems.length) % heroItems.length;
      const item = heroItems[heroIndex];

      // Fade transition
      els.heroBg.classList.add("fade");
      setTimeout(()=>{
        const bg = (item.thumbnail && item.thumbnail.trim()) ? item.thumbnail.trim()
          : FALLBACK_WALLPAPERS[heroIndex % FALLBACK_WALLPAPERS.length];

        els.heroBg.style.backgroundImage = `url("${bg}")`;
        els.heroTitle.textContent = item.title || "Untitled";
        els.heroDesc.textContent = item.description || "Click Play to watch.";
        els.heroBg.classList.remove("fade");
      }, 250);

      els.heroPlay.onclick = ()=>openWatch(item);
      els.heroMore.onclick = ()=>openWatch(item);

      // Dots
      els.dots.innerHTML = heroItems.map((_, idx)=>`<span class="dot ${idx===heroIndex?'active':''}"></span>`).join("");
      Array.from(els.dots.children).forEach((dot, idx)=>{
        dot.addEventListener("click", ()=>{ setHero(idx); restartHero(); });
      });
    }

    function restartHero(){
      if (heroTimer) clearInterval(heroTimer);
      heroTimer = setInterval(()=> setHero(heroIndex + 1), 6000);
    }

    function applySearch(){
      const q = (els.q.value || "").trim().toLowerCase();
      const filtered = !q ? all : all.filter(v =>
        (v.title || "").toLowerCase().includes(q) ||
        (v.category || "").toLowerCase().includes(q) ||
        (v.description || "").toLowerCase().includes(q)
      );
      renderRows(filtered);

      // Keep hero independent of search (like Netflix)
    }

    async function loadVideos(){
      els.loading.style.display = "";
      els.loading.textContent = "Loading…";

      const snap = await db.collection("videos").orderBy("createdAt", "desc").get();
      all = snap.docs.map(d => ({ id: d.id, ...d.data() }));

      renderRows(all);

      heroItems = pickHeroItems(all);
      setHero(0);
      restartHero();
    }

    // intro hide
    setTimeout(()=>{ els.intro.classList.add("hidden"); }, 1400);

    els.q.addEventListener("input", applySearch);

    loadVideos().catch(err=>{
      console.error(err);
      els.loading.style.display = "";
      els.loading.textContent = "Failed to load. Check Firestore + rules.";
      setHero(0);
    });
  </script>
</body>
</html>
