<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coin Ad Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background: #f9fafb; }
    .card { @apply bg-white shadow-md rounded-2xl p-6; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center">

  <!-- Header -->
  <div class="w-full bg-indigo-600 text-white p-4 text-center text-2xl font-bold shadow">
    Coin Ad Platform 🚀
  </div>

  <!-- Auth Section -->
  <div id="auth-section" class="mt-10 text-center">
    <button onclick="login()" class="bg-indigo-500 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg shadow-lg">
      Login with Google
    </button>
  </div>

  <!-- Dashboard Section -->
  <div id="dashboard" class="hidden max-w-3xl w-full mt-10 space-y-6">
    <div class="card flex justify-between items-center">
      <div>
        <h2 class="text-xl font-bold" id="username">Welcome User</h2>
        <p class="text-gray-600">Coins: <span id="coins">0</span></p>
      </div>
      <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg">
        Logout
      </button>
    </div>

    <!-- Referral -->
    <div class="card">
      <h3 class="text-lg font-semibold mb-2">Referral System</h3>
      <p class="text-gray-700">Share this link with friends:</p>
      <input id="referral-link" class="w-full border rounded p-2 mt-2" readonly>
    </div>

    <!-- Watch Ads -->
    <div class="card">
      <h3 class="text-lg font-semibold mb-2">Watch Ads & Earn Coins</h3>
      <p class="text-gray-600">Click below to watch ads and get coins instantly.</p>
      <button onclick="watchAd()" class="mt-3 bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg">
        Watch Ad → +50 Coins
      </button>
    </div>

    <!-- Launch Ads -->
    <div class="card">
      <h3 class="text-lg font-semibold mb-2">Launch Your Ad</h3>
      <textarea id="ad-content" class="w-full border rounded p-2" placeholder="Write your ad..."></textarea>
      <button onclick="launchAd()" class="mt-3 bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg">
        Launch Ad (cost: 200 coins)
      </button>
      <p id="ad-status" class="mt-2 text-sm text-gray-500"></p>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"></script>

  <script>
    // Firebase Config (your details)
    const firebaseConfig = {
      apiKey: "AIzaSyCUnWnmNHHJPFKzkyJ59-cK8kag6OpIoIM",
      authDomain: "website-5636d.firebaseapp.com",
      projectId: "website-5636d",
      storageBucket: "website-5636d.appspot.com",
      messagingSenderId: "737574321288",
      appId: "1:737574321288:web:e92da5e5b4d63b87d8b33d",
      measurementId: "G-S64W6JR12C"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser;

    // Login
    async function login() {
      const provider = new firebase.auth.GoogleAuthProvider();
      const result = await auth.signInWithPopup(provider);
      currentUser = result.user;
      setupUser(currentUser);
    }

    // Logout
    async function logout() {
      await auth.signOut();
      document.getElementById("dashboard").classList.add("hidden");
      document.getElementById("auth-section").classList.remove("hidden");
    }

    // Setup User
    async function setupUser(user) {
      const userRef = db.collection("users").doc(user.uid);
      const doc = await userRef.get();

      if (!doc.exists) {
        await userRef.set({ name: user.displayName, coins: 1000, referrals: 0 });
      }

      // Live update
      userRef.onSnapshot(doc => {
        const data = doc.data();
        document.getElementById("username").innerText = "Welcome " + data.name;
        document.getElementById("coins").innerText = data.coins;
        document.getElementById("referral-link").value =
          window.location.origin + "/?ref=" + user.uid;
      });

      document.getElementById("auth-section").classList.add("hidden");
      document.getElementById("dashboard").classList.remove("hidden");
    }

    // Watch Ad
    async function watchAd() {
      if (!currentUser) return;
      const userRef = db.collection("users").doc(currentUser.uid);
      await userRef.update({
        coins: firebase.firestore.FieldValue.increment(50)
      });
      alert("You earned 50 coins!");
    }

    // Launch Ad
    async function launchAd() {
      if (!currentUser) return;
      const adText = document.getElementById("ad-content").value;
      if (!adText) return alert("Write something first!");

      const userRef = db.collection("users").doc(currentUser.uid);
      const doc = await userRef.get();
      const coins = doc.data().coins;

      if (coins < 200) {
        document.getElementById("ad-status").innerText = "Not enough coins!";
        return;
      }

      await userRef.update({
        coins: firebase.firestore.FieldValue.increment(-200)
      });

      await db.collection("ads").add({
        uid: currentUser.uid,
        content: adText,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      document.getElementById("ad-status").innerText = "Ad launched successfully!";
      document.getElementById("ad-content").value = "";
    }

    // Auto login check
    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        setupUser(user);
      }
    });
  </script>
</body>
</html>
